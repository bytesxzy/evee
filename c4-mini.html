<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* PowerShell / conhost glass. Selectors the scripts already read stay. */
:root{
  color-scheme:light dark;
  --bg:#f0f0f0;
  --oat:rgba(255,255,255,.42);
  --oat-solid:rgba(255,255,255,.62);
  --accent:#0c0c0c;
  --muted:#5a5a5a;
  --line:rgba(0,0,0,.14);
  --line-soft:rgba(0,0,0,.08);
  --r-sm:2px;
  --r-md:8px;
  --shadow:0 12px 40px -16px rgba(0,0,0,.22);
  --shadow-lg:0 24px 64px -18px rgba(0,0,0,.28);
  --glass:blur(24px) saturate(140%);
  --sans:Consolas,'Cascadia Mono','Cascadia Code','Lucida Console',ui-monospace,monospace;
  --display:Consolas,'Cascadia Mono','Lucida Console',ui-monospace,monospace;
  --mono:Consolas,'Cascadia Mono','Cascadia Code','Lucida Console',ui-monospace,monospace;
  --me:#0c0c0c;
  --me-ink:#f0f0f0;
  --term:rgba(240,240,240,.55);
  --term-bar:rgba(255,255,255,.38);
  --ok:#cccccc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0c0c;
    --oat:rgba(255,255,255,.06);
    --oat-solid:rgba(20,20,20,.72);
    --accent:#cccccc;
    --muted:#808080;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.08);
    --shadow:0 12px 40px -16px rgba(0,0,0,.7);
    --shadow-lg:0 24px 64px -18px rgba(0,0,0,.8);
    --me:#cccccc;
    --me-ink:#0c0c0c;
    --term:rgba(12,12,12,.62);
    --term-bar:rgba(12,12,12,.5);
    --ok:#cccccc;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0c0c;--oat:rgba(255,255,255,.06);--oat-solid:rgba(20,20,20,.72);
  --accent:#cccccc;--muted:#808080;--line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.08);
  --shadow:0 12px 40px -16px rgba(0,0,0,.7);
  --shadow-lg:0 24px 64px -18px rgba(0,0,0,.8);
  --me:#cccccc;--me-ink:#0c0c0c;
  --term:rgba(12,12,12,.62);--term-bar:rgba(12,12,12,.5);
  --ok:#cccccc;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:transparent}
body{background:var(--bg);font-family:var(--mono);color:var(--accent);
     -webkit-font-smoothing:antialiased}
/* Embedded in an iframe the page IS the panel, so the ground goes transparent
   and the parent's background shows through the glass. */
body.embed{background:transparent!important;color-scheme:inherit}
html:has(body.embed){background:transparent!important;color-scheme:inherit}

#launcher{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:2px;
  border:1px solid var(--line);background:var(--oat);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);box-shadow:var(--shadow);cursor:pointer;display:flex;
  align-items:center;justify-content:center;z-index:40}
#launcher:hover{box-shadow:var(--shadow-lg)}
#launcher svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6}
#launcher .live{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:0;
  background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
body.embed #launcher{display:none}

#panel{position:fixed;right:18px;bottom:82px;width:392px;max-width:calc(100vw - 24px);
  height:min(600px,calc(100vh - 110px));display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--term);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;z-index:41}
#panel.open{opacity:1;pointer-events:auto}
body.embed #panel{position:relative;width:100%;height:100%;max-width:none;right:auto;bottom:auto;
  opacity:1;pointer-events:auto;border-radius:0;border:0;
  box-shadow:none;background:transparent}

.term-dots{display:none}

.top{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft);
  background:var(--term-bar);-webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px)}
.badge{width:22px;height:22px;border-radius:0;border:1px solid var(--line);
  background:transparent;display:flex;align-items:center;justify-content:center}
.badge svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.7}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0}
.who span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0}
.icobtn{width:26px;height:26px;border-radius:0;border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.icobtn:hover{border-color:var(--line);background:var(--oat-solid);color:var(--accent)}
.icobtn.on{background:var(--accent);color:var(--bg);border-color:transparent}
.ext{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px;
  display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ext b{font-weight:400;color:var(--accent)}
body.embed .close{display:none}

#log,#panel,.c4-code pre,#chips{
  scrollbar-width:none;-ms-overflow-style:none}
#log::-webkit-scrollbar,#panel::-webkit-scrollbar,.c4-code pre::-webkit-scrollbar,
#chips::-webkit-scrollbar,html::-webkit-scrollbar,body::-webkit-scrollbar{
  width:0!important;height:0!important;display:none!important}
#log{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:0;
  justify-content:flex-start}
#log > .msg{order:0;overflow-anchor:none}
#chips{order:50}#status{order:60}.ask{order:70;overflow-anchor:auto}
#chips:empty{display:none}
.msg{max-width:100%;font-size:13px;line-height:1.35;border-radius:0;padding:0;
  white-space:pre-wrap;overflow-wrap:anywhere;animation:none;
  font-family:var(--mono);background:transparent;border:0;box-shadow:none}
@keyframes rise{from{opacity:0}to{opacity:1}}
.msg.bot{align-self:stretch;background:transparent;border:0;color:var(--accent);margin:0}
.msg.me{align-self:stretch;background:transparent;color:var(--accent);border:0;margin:1.15em 0 0}
.msg.me::before{content:"PS> "}
.msg.bot.think{min-height:1.35em}
.meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:underline;
  border:0;border-radius:0;padding:0}
.src:hover{color:var(--accent);background:var(--oat-solid)}
.src{display:inline-flex;align-items:center;gap:5px}
.source-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex:0 0 14px;line-height:1;font-size:13px}
.source-icon img{display:block;width:14px;height:14px;object-fit:contain;border-radius:2px}
.also{margin-top:7px;font-size:12px;color:var(--muted)}

/* Derived answers: the program, its output, and why this route was taken.
   Everything here is monospace and quiet -- the answer is the headline, the
   working is available underneath for anyone who wants to check it. */
.c4-code{margin-top:9px;border:1px solid var(--line);border-radius:0;
  background:rgba(0,0,0,.06);overflow:hidden}
:root[data-theme="dark"] .c4-code,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c4-code{
  background:rgba(255,255,255,.04)}}
.c4-code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:5px 9px;border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted)}
.c4-code pre{margin:0;padding:9px 11px;overflow-x:auto;font-family:var(--mono);
  font-size:11px;line-height:1.55;white-space:pre;color:var(--accent)}
.c4-copy{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;
  border:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);
  padding:1px 8px;cursor:pointer;flex:0 0 auto}
.c4-copy:hover{color:var(--accent);border-color:var(--accent)}
/* Per-line explanation. Each line is its own focusable row so a reader can
   click or tab to it and be told what that line does, sourced from the IR
   node that produced it rather than from the text. */
.c4-code pre code.c4-lines{display:block}
.c4-line{display:block;padding:0 8px;margin:0 -8px;border-left:2px solid transparent;
  cursor:pointer;white-space:pre}
.c4-line:hover{background:rgba(0,0,0,.05)}
:root[data-theme="dark"] .c4-line:hover,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c4-line:hover{
  background:rgba(255,255,255,.07)}}
.c4-line:focus{outline:none}
.c4-line.sel{background:rgba(0,0,0,.07);border-left-color:var(--accent)}
:root[data-theme="dark"] .c4-line.sel,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c4-line.sel{
  background:rgba(255,255,255,.10)}}
.c4-line-n{display:inline-block;width:2.2em;text-align:right;margin-right:10px;
  color:var(--muted);opacity:.55;-webkit-user-select:none;user-select:none}
.c4-exp{border-top:1px solid var(--line-soft);padding:9px 11px;font-size:11.5px;
  line-height:1.55;color:var(--accent)}
.c4-exp .c4-exp-hint{color:var(--muted);font-style:italic}
.c4-exp h5{margin:0 0 4px;font-size:11.5px;font-weight:600}
.c4-exp .c4-exp-why{color:var(--muted);margin-bottom:6px}
.c4-exp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.c4-exp dt{font-family:var(--mono);font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;padding-top:1px}
.c4-exp dd{margin:0}
.c4-exp code{font-family:var(--mono);font-size:10.5px}
.c4-exp .c4-exp-note{margin-top:6px;padding-left:9px;border-left:2px solid var(--line);
  color:var(--muted)}
.c4-out{margin-top:7px;padding:7px 10px;border-left:2px solid var(--accent);
  font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap;
  color:var(--accent);background:rgba(0,0,0,.03)}
:root[data-theme="dark"] .c4-out{background:rgba(255,255,255,.04)}
.c4-why{margin-top:8px;font-size:11px;color:var(--muted)}
.c4-why summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase}
.c4-why summary::-webkit-details-marker{display:none}
.c4-why summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.c4-why[open] summary::before{content:"▾ "}
.c4-why p{margin:6px 0 0;line-height:1.6}
.c4-why ol{margin:6px 0 0 16px;padding:0;line-height:1.6}
.c4-steps{margin:7px 0 0 16px;padding:0;font-size:12px;line-height:1.65}
.c4-badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:0;
  text-transform:none;border:1px solid var(--line);border-radius:0;
  padding:0 6px;color:var(--muted);margin-right:5px}
.c4-badge.ran{border-color:var(--accent);color:var(--accent)}
.c4-badge.warn{border-color:var(--muted);color:var(--muted)}
.think{display:flex;gap:0;align-items:center;padding:0}
.think i{width:auto;height:auto;border-radius:0;background:none;display:none;
  animation:none;font-style:normal}
.think i:first-child{display:inline-block;width:1ch;height:1em;overflow:hidden;
  line-height:1em;color:var(--accent);vertical-align:baseline}
.think i:first-child::after{content:"|/-\005C";display:block;width:1ch;word-break:break-all;
  animation:c4spin .6s steps(4) infinite}
.think i:nth-child(2),.think i:nth-child(3){display:none}
@keyframes c4spin{to{transform:translateY(-4em)}}

#chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
#chips button{font-size:12px;font-family:var(--mono);color:var(--muted);background:transparent;
  border:0;border-radius:0;padding:0;cursor:pointer;text-decoration:underline}
#chips button::before{content:"PS> "}
#chips button:hover{color:var(--accent)}

.ask{display:flex;align-items:center;gap:6px;padding:4px 0 8px;border-top:0;
  background:transparent;position:relative;flex-shrink:0}
.ask .prompt{flex-shrink:0;font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:400;
  line-height:1.35;padding:0;user-select:none}
.ask input{flex:1;min-width:0;background:transparent;border:0;border-radius:0;
  padding:0;font-family:var(--mono);font-size:13px;line-height:1.35;
  color:var(--accent);outline:none;caret-color:var(--accent);caret-shape:block}
.ask input::placeholder{color:var(--muted);opacity:.55}
.ask input:focus{border-color:transparent;outline:none}
.ask button{border:0;border-radius:0;padding:0;background:transparent;
  color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:400;cursor:pointer;
  opacity:.45}
.ask button:hover{color:var(--accent);opacity:1}
.ask button:active{transform:none}

#status{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:0 14px 9px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#status b{font-weight:500;color:var(--accent)}
#status .sep{opacity:.4}
#status a{color:var(--muted);text-decoration:underline;cursor:pointer}
#status a:hover{color:var(--accent)}
</style>
<style>
/* The surrounding C4 mini dialog supplies the title and window controls. */
body.embed .top, body.embed #status { display: none; }
html, body { width: 100%; min-width: 0; overflow: hidden; scrollbar-width: none; -ms-overflow-style: none; }
html { -webkit-text-size-adjust: 100%; }
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
body.embed #panel { background: transparent; min-height: 0; height: 100%; height: 100dvh; }
#log { min-height: 0; min-width: 0; padding: 8px 12px; overscroll-behavior: contain; }
.msg { flex: 0 0 auto; min-width: 0; }
.src { max-width: 100%; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
.ask { flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.ask input { font-size: 16px; min-height: 32px; }
.ask button { min-height: 32px; min-width: 0; flex-shrink: 0; }

@media (max-width: 600px) {
  #log { padding: 12px; }

  #chips button { flex-shrink: 0; min-height: 44px; }

}
@media (max-height: 360px) { #chips { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script>
window.addEventListener('message', function (event) {
  if (event.source !== window.parent || !event.data || event.data.type !== 'c4-mini-theme') return;
  if (event.data.theme === 'dark' || event.data.theme === 'light') document.documentElement.setAttribute('data-theme', event.data.theme);
});
document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape' && window.parent !== window) window.parent.postMessage({type: 'c4-mini-close'}, '*');
});
</script>

/* Public databases robots.html can query with no key and no server.
 *
 * Every source here is (a) free, (b) keyless, and (c) chosen because it
 * documents CORS support -- a browser cannot call an API that does not send
 * Access-Control-Allow-Origin, no matter how public it is. That last property
 * is the one that decides whether a source is usable at all, and it is a
 * decision each of these services makes on their servers, not something this
 * file can guarantee. So none of them are trusted: robots.js probes a source
 * the first time it is used and disables it permanently on this device if it
 * does not answer. `robots.diagnose()` prints the live verdict.
 *
 * Requests are plain GETs with no custom headers, which keeps them "simple
 * requests" and avoids a CORS preflight that several of these would refuse.
 *
 * ── ON LINKEDIN ──────────────────────────────────────────────────────────
 * There is no keyless LinkedIn API and there cannot be one here. Every
 * LinkedIn API (Marketing, Talent, Sign In with LinkedIn) requires OAuth plus
 * partner approval, their servers send no CORS headers to a page like this,
 * and scraping profiles is a breach of their User Agreement. Anything claiming
 * otherwise is a paid scraper reselling data of contested provenance behind a
 * key. So: people and companies are served here by Wikidata (notable people
 * and organisations) and GLEIF (the global registry of legal entities, with
 * real addresses and ownership), which are open by design rather than open by
 * accident.
 */
(function () {
  "use strict";

  function txt(v) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim(); }

  /* Character-count clipping used to back up to only the previous space. That
     can leave answers ending in glue words such as "and…", "of…", or "the…".
     Prefer a complete sentence, then a clause, then a clean content-word edge. */

           term frequency then hands the question to whichever passage repeats

  /* --------------------------------------------------------------- answers */

  var SMALL = [
    [/^(hi|hey|hello|yo|sup|hola|gm)\b/i,
     "Hey. Ask me anything about CELL4 — what the agency does, the work, robots.js, the community, or how to get in touch."],
    [/\b(thanks|thank you|ty|appreciate)\b/i, "Anytime."],
    [/\b(bye|goodbye|cya|see ya)\b/i, "See you."],
    [/\b(who|what) (are|r) (you|u)\b/i,
     "robots.html — a small assistant that reads this site and answers out of it. I run entirely in your browser and I learn from the questions people ask me."],
    [/\b(are you (chat)?gpt|are you claude|are you ai|which model|what model|openai)\b/i,
     "No hosted model and no API. I am a sparse log-linear language model trained on this site's own text — the same model class the CELL4 ARC engine reasons with — running locally in this page."],
    [/\b(help|what can you (do|answer))\b/i,

  // Short company questions contain few distinctive search words. Resolve
  // their intent against specific dataset facts before applying research gates.
  function basicSiteAnswer(question) {
    var branded = /cell4/i.test(question);
    var q = String(question).toLowerCase().replace(/[’']/g, "'")
      .replace(/what's/g, 'what is').replace(/who's/g, 'who is')
      .replace(/cell4(?:\.art)?(?:'s)?/g, ' ')
      .replace(/^(?:hi|hey|hello)[,\s]+/, '')
      .replace(/\bplease\b/g, ' ').replace(/[?!.,]/g, ' ')
      .replace(/\s+/g, ' ').trim();

      // Prefer a focused factual sentence over a long pairing of unrelated facts.
      var found = brain.passages.filter(function (p) { return !p.x && pattern.test(p.t); });
      found.sort(function (a, b) { return a.t.length - b.t.length; });
      return found.length ? found[0].t : '';
    }
    function result(parts, path) {
      var text = parts.filter(Boolean).join(' ');
      return text ? {text: text, sources: ['https://cell4.art/' + (path || '')], siteBasic: true} : null;
    }
    var overview = /^(?:what is(?: it)?(?: about)?|who is|who are|what does(?: (?:it )?do)?|what do (?:you )?do|tell me about|about|explain|overview|give me (?:an? )?(?:overview|summary))$/.test(q);
    var services = /^(?:what (?:are (?:your |the )?services|services (?:do you (?:offer|provide)|does (?:it )?(?:offer|provide)|are offered))|(?:your )?services|what can (?:you |it )?do|what do you offer)$/.test(q);
    if ((branded && (overview || !q)) || services) {
      return result([
        fact(/\bb2b agency for web3, gaming/i),
        fact(/3d design, growth marketing, social media, and management as service pillars/i) ||
          fact(/multipurpose agency for 3d design, marketing, and management/i)
      ]);
    }
    if ((branded && /\b(contact|email|inquiry|inquire|reach|hire)\b/.test(q)) ||
        /^(?:how (?:do|can) i (?:get in touch|contact you|reach you|start a project)|(?:your )?(?:contact|email)(?: details| address)?|contact information)$/.test(q)) {
      var email = fact(/inquire@cell4\.art/i);
      if (email) return result(['You can contact CELL4 at inquire@cell4.art.', fact(/typically replies within 48/i)]);
    }
    if ((branded && /\b(proof of work|portfolio|case studies)\b/.test(q)) ||
        /^(?:(?:show me|where is|where can i see|what is|tell me about) (?:the |your )?)?(?:proof of work|portfolio|case studies|examples of (?:your )?work)$/.test(q)) {
      return result([fact(/volume one highlights/i), fact(/some work cannot be displayed because of nda/i)], 'wahx.html');
    }
    if ((branded && /\b(founder|founded|started)\b/.test(q)) ||
        /^(?:who is (?:the |your )?founder|who founded (?:it|the agency)|who is yama)$/.test(q)) {
      return result([fact(/yama.*founder and b2b architect/i)]);
    }
    if ((branded && /\bteam\b/.test(q)) || /^(?:who is on (?:the |your )?team|(?:your |the )?team)$/.test(q)) {
      return result([fact(/public.*team section includes yama/i)]);
    }
    if ((branded && /\b(reply|response|respond)\b/.test(q)) ||
        /^(?:how long (?:does it take (?:you )?to (?:reply|respond)|until (?:a |you )?reply)|(?:your )?response time)$/.test(q)) {
      return result([fact(/typically replies within 48/i) || fact(/48.*hour response window/i)]);
    }
    if (/^(?:what is|tell me about|how (?:do|can) i (?:join|use)) (?:the )?(?:lounge|community)$/.test(q) ||
        /^(?:do i need (?:an? )?account|is (?:an? )?account required) (?:for|to use) (?:the )?lounge$/.test(q)) {
      return result([fact(/lounge.*(?:separate art\/community product|open.*board)/i),
        fact(/lounge.*guest browsing, posting, and reacting.*without/i)], 'lounge');
    }
    // Dots were normalized above, so robots.js becomes "robots js" here.
    if (/^(?:what is|tell me about|how (?:do|can) i (?:get|download)|is) robots js(?: free)?$/.test(q) || q === 'robots js') {
      return result([fact(/robots\.js.*(?:reply agent|browser.*(?:x|twitter)|replies to relevant posts)/i),
        fact(/robots\.js.*free for cell4 members/i)]);
    }
    return null;
  }

  function answer(question, datasetOnly) {
    var basic = basicSiteAnswer(question);
    if (basic) return basic;
    for (var i = 0; !datasetOnly && i < SMALL.length; i++) {
      if (SMALL[i][0].test(question.trim())) return { text: SMALL[i][1], sources: [] };
    }
    var q = tok(question), hits = brain.rank(question);
    if (!hits.length) {
      return { text: "I could not find that on this site. I only answer from what is actually published here — try what CELL4 does, the proof of work, robots.js, the community, or contact.",
               sources: [] };
    }
    var top = hits[0], body = best(top.p.t, q, 3);
    if (body.split(/\s+/).length < 8 && hits[1]) {
      var more = best(hits[1].p.t, q, 2);
      if (more && more.toLowerCase().indexOf(body.toLowerCase()) < 0) {
        return { text: clamp(more, 460), sources: [hits[1].p.s, top.p.s], hit: hits[1] };
      }
    }
    var h = (top.p.h || "").replace(/[:\s]+$/, "");
    var lead = (h && h.split(/\s+/).length <= 10 &&
                body.toLowerCase().indexOf(h.toLowerCase()) !== 0) ? h + " — " : "";
    var out = { text: clamp(lead + body, 460), sources: [top.p.s], hit: top };
    if (hits[1] && hits[1].score > top.score * 0.62) {
      var alt = best(hits[1].p.t, q, 1);
      var sameContext = !(top.p.x && hits[1].p.x && q.length > 1 &&
                          hits[1].coverage + 0.15 < top.coverage);
      if (top.p.x && hits[1].p.x && headingIntentPenalty(question, hits[1].p.h)) sameContext = false;
      if (sameContext && alt && alt.length > 14 && out.text.indexOf(alt.slice(0, 22)) < 0) {
        out.also = clamp(alt, 220);
        out.sources.push(hits[1].p.s);
      }
    }
    return out;
  }

  /* ------------------------------------------------------- self-improvement
   * Every answered question is a labelled example: these words went with that
   * passage. The page takes a gradient step on the passage's own rows of the
   * language model, and keeps it only if a held-out set of earlier questions
   * is still ranked at least as well. That is the same rule the ARC engine
   * lives by -- a change has to earn its place against the version it
   * replaces -- with mean reciprocal rank standing in for the sign test.
   *
   * The weights learned here stay in this browser. `robots.export()` writes
   * them out so they can be folded back into the trained model.
   */
  function Learner(brain) {
    this.b = brain;
    this.hist = [];        /* [{q, passage}] recent, for the gate */
    this.events = [];      /* adopted / rejected, for the status line */
    this.load();
  }

  Learner.prototype.load = function () {
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      this.b.deltas = s.deltas || {};
      this.hist = s.hist || [];
      this.events = s.events || [];
      this.b._cache = {};
    } catch (e) { /* private mode, cleared storage: start fresh */ }
  };

  Learner.prototype.save = function () {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        deltas: this.b.deltas, hist: this.hist.slice(-40), events: this.events.slice(-30)
      }));
    } catch (e) {}
  };

  /* Mean reciprocal rank of the remembered (question -> passage) pairs. */
  Learner.prototype.mrr = function () {
    if (!this.hist.length) return 1;
    var total = 0;
    for (var i = 0; i < this.hist.length; i++) {
      var h = this.hist[i], r = this.b.rank(h.q), place = 0;
      for (var j = 0; j < r.length; j++) {
        if (r[j].p.key === h.key) { place = j + 1; break; }
      }
      total += place ? 1 / place : 0;
    }
    return total / this.hist.length;
  };

  Learner.prototype.step = function (question, hit, sign) {
    if (!hit || !this.b.lm) return null;
    var rows = (hit.p.g || []).filter(function (f) { return f.indexOf("s|") === 0; });
    if (!rows.length) return null;              /* nothing document-specific to move */
    var q = tok(question).map(this.b.vocabForm, this.b).filter(Boolean);
    if (!q.length) return null;

    var before = this.mrr();
    var backup = JSON.stringify(this.b.deltas);
    var d = this.b.docDist(hit.i), lr = 0.25 * sign, v = this.b.lm.vocab;
    var target = Object.create(null), i, t, f;
    for (i = 0; i < q.length; i++) target[q[i]] = 1 / q.length;

    for (i = 0; i < v.length; i++) {
      t = v[i];
      var g = (d[t] || 0) - (target[t] || 0);
      if (Math.abs(g) < 1e-4) continue;
      for (var k = 0; k < rows.length; k++) {
        f = rows[k];
        var row = this.b.deltas[f] || (this.b.deltas[f] = {});
        var nv = (row[t] || 0) - lr * g;
        row[t] = Math.max(-1.5, Math.min(1.5, nv));   /* clipped: no runaway */
      }
    }
    this.b._cache = {};

    var key = hit.p.key;
    if (sign > 0 && !this.hist.some(function (h) { return h.q === question; })) {
      this.hist.push({ q: question, key: key });
      if (this.hist.length > 40) this.hist.shift();
    }
    var after = this.mrr();
    var adopted = after >= before - 1e-9;
    if (!adopted) {
      this.b.deltas = JSON.parse(backup);        /* the gate said no */
      this.b._cache = {};
    }
    this.events.push({ t: Date.now(), adopted: adopted,
                       before: +before.toFixed(3), after: +after.toFixed(3) });
    if (this.events.length > 30) this.events.shift();
    this.save();
    return { adopted: adopted, before: before, after: after };
  };

  Learner.prototype.summary = function () {
    var a = 0;
    for (var i = 0; i < this.events.length; i++) if (this.events[i].adopted) a++;
    return { rounds: this.events.length, adopted: a,
             weights: Object.keys(this.b.deltas).length };
  };

  /* ----------------------------------------------------------- live reading
   * Same-origin only -- a browser will not let any page fetch a third party's
   * site, and no amount of JavaScript changes that. What it will let this page
   * read is the rest of cell4.art, which is where the architecture notes and

  /* ------------------------------------------------------- identity ladder

    return { ok: true, extras: ht.length - qt.length };

    if (na !== nb) return false;
    for (i = 0; i < qt.length; i++) if (!sb[qt[i]]) return false;

      if (identityEqual(title, a)) return { tier: TIER_VERIFIED_TITLE, reason: "exact-title" };
      return { tier: TIER_VERIFIED_ALIAS, reason: "verified-alias" };

    if (identityEqual(title, a)) return { tier: TIER_EXACT_PHRASE, reason: "identity-equal" };

    var floor = best >= TIER_EXACT_PHRASE ? TIER_EXPANDED + 1 : 0;

  function grammaticalFamilies(raw, siteLexicon, state) {
    var sig = tsSignatures(raw, state, siteLexicon), has = Object.create(null), i;
    for (i = 0; i < sig.length; i++) has[sig[i]] = 1;

    if (form === "compare") out.push("comparison");
    if (form === "howto") { out.push("howto"); out.push("explanation"); }
    if (form === "howwork") { out.push("explanation"); out.push("definition"); }
    if (form === "why") { out.push("explanation"); out.push("definition"); }
    if (sr.relation && sr.subject) out.push("relational_fact");
    if (form === "whois" || /\bwho\b/i.test(String(raw || ""))) out.push("identity");
    if (form === "whatis" || form === "define" || form === "tellme" ||

    if (has["convo:yes"] || form === "meta" || form === "social" ||

       is whatever the previous turn was about: both branches stay open and the
       model decides. Omitting this rule here while text/families.py had it was

    if (has["pron:yes"] || has["cont:yes"]) {

       only when it is not already a content question. "capital of France" is
       six tokens with no question word, and admitting `conversational` for it
       would put a factual lookup on the same ballot as small talk. */
    if ((form === "bare" || form === "bare_q" || form === "social" || form === "meta") &&
        tsRawTokens(raw).length <= 6) {

  /* ------------------------------------------------------ model inference
     The same sparse log-linear arithmetic text/lm.py fitted. Sixty lines,
     because the model is sparse and linear on purpose. */

  var TS_PAIR_GROUPS = [["form", "len"], ["form", "case"], ["form", "convo"],
    ["form", "ctx"], ["case", "len"], ["ctx", "pron"], ["shift", "ctx"], ["cont", "ctx"]];

  function tsGroup(t) { var i = t.indexOf(":"); return i < 0 ? t : t.slice(0, i); }

  function queryFeatures(sigs) {
    var feats = ["b"], byGroup = Object.create(null), i, j, k;
    for (i = 0; i < sigs.length; i++) {
      feats.push("s|" + sigs[i]);
      var g = tsGroup(sigs[i]);
      (byGroup[g] || (byGroup[g] = [])).push(sigs[i]);
    }
    var pg = (textModel && textModel.contract && textModel.contract.pair_groups) || TS_PAIR_GROUPS;
    for (i = 0; i < pg.length; i++) {
      var A = byGroup[pg[i][0]] || [], Bg = byGroup[pg[i][1]] || [];
      for (j = 0; j < A.length; j++) for (k = 0; k < Bg.length; k++)
        feats.push("c|" + A[j] + "|" + Bg[k]);
    }
    return feats;
  }

  function tsSoftmax(logits) {
    var keys = Object.keys(logits), i, peak = -Infinity, out = {}, z = 0;
    if (!keys.length) return out;
    for (i = 0; i < keys.length; i++) if (logits[keys[i]] > peak) peak = logits[keys[i]];
    for (i = 0; i < keys.length; i++) { out[keys[i]] = Math.exp(logits[keys[i]] - peak); z += out[keys[i]]; }
    if (!z) z = 1;
    for (i = 0; i < keys.length; i++) out[keys[i]] /= z;
    return out;
  }

  function familyDist(raw, state, siteLexicon) {
    var allowed = grammaticalFamilies(raw, siteLexicon, state), i, out = {};
    if (!textModel || !textModel.family_weights) {
      for (i = 0; i < allowed.length; i++) out[allowed[i]] = 1 / allowed.length;
      return out;
    }
    var feats = queryFeatures(tsSignatures(raw, state, siteLexicon)), logits = {};
    for (i = 0; i < allowed.length; i++) logits[allowed[i]] = 0;
    for (i = 0; i < feats.length; i++) {
      var row = textModel.family_weights[feats[i]];
      if (!row) continue;
      for (var f in logits) { var v = row[f]; if (v) logits[f] += v; }
    }
    return tsSoftmax(logits);
  }

  function candidateSignature(asked, cand) {
    var title = String((cand && cand.title) || "");
    var cont = orderedContainment(asked, title), sq = splitQualifier(title);
    var cov = tsCoverage(asked, (cand.text || "") + " " + title);
    var coh = Number(cand.coherence || 0), conc = Number(cand.concentration || 0);
    return [
      "tier:" + (TIER_NAMES[Number(cand.tier || 0)] || "fuzzy"),
      "exp:" + (!cont.ok ? "no" : String(Math.min(cont.extras, 3))),
      "cov:" + String(tsBucket(cov, [0.0, 0.34, 0.67, 0.99])),
      "coh:" + String(tsBucket(coh, [0.2, 0.4, 0.6, 0.8])),
      "conc:" + String(tsBucket(conc, [0.2, 0.5, 0.8])),
      "src:" + String(cand.source || "unknown"),
      "rank:" + String(tsBucket(Number(cand.rank == null ? 9 : cand.rank), [0, 1, 2, 4])),
      "qual:" + (sq.qualifier ? "yes" : "no"),
      "dis:" + (cand.disambiguation ? "yes" : "no"),
      "read:" + (cand.fullText ? "yes" : "no"),
      "dup:" + (duplicateMismatch(asked, title) ? "yes" : "no"),
      "tlen:" + String(tsBucket(identityTokens(sq.base).length, [1, 2, 3, 5]))
    ];
  }

  function candidateFeatures(qsigs, csigs) {
    var feats = ["b"], i, j;
    for (i = 0; i < csigs.length; i++) feats.push("d|" + csigs[i]);
    for (i = 0; i < qsigs.length; i++) {
      if (!/^(?:form|len|case|dup):/.test(qsigs[i])) continue;
      for (j = 0; j < csigs.length; j++) feats.push("x|" + qsigs[i] + "|" + csigs[j]);
    }
    return feats;
  }

  function candidateScore(qsigs, csigs) {
    if (!textModel || !textModel.candidate_weights) return 0;
    var feats = candidateFeatures(qsigs, csigs), z = 0;
    for (var i = 0; i < feats.length; i++) {
      var v = textModel.candidate_weights[feats[i]];
      if (v) z += v;
    }
    return z;
  }

  /* ------------------------------------------------------- dialogue state
     Topic coherence has to survive more than one message, and has to die on
     command. Keyword overlap alone would do neither: it drags a stale subject
     into an unrelated question, and it clings when the user explicitly moves
     on. So the state is explicit, decays, and is reset by grammar rather than
     by similarity. */

  function DialogueState() {
    this.subject = "";        /* the phrase the user named */
    this.entity = "";         /* the canonical title it resolved to */
    this.relation = "";
    this.confidence = 0;
    this.turns = 0;
    this.lastAct = "";
    this.lastPlan = -1;
    this.source = "";
    this.evidenceSeen = [];   /* exact source sentences already shown for this topic */
    this.prior = [];          /* recent (subject, entity) pairs, newest first */
  }

  DialogueState.prototype.snapshot = function () {
    return { subject: this.subject, entity: this.entity, relation: this.relation,
             confidence: this.confidence, turns: this.turns, lastAct: this.lastAct,
             source: this.source, evidenceSeen: this.evidenceSeen.slice(0, 24),
             prior: this.prior.slice(0, 4) };
  };

  /* An explicit shift wins over everything. A new concrete subject replaces the
     old one outright rather than blending with it -- "decay old context
     aggressively when a new explicit subject appears". */
  DialogueState.prototype.plan = function (raw) {
    var sig = tsSignatures(raw, this.snapshot(), null), has = Object.create(null), i;
    for (i = 0; i < sig.length; i++) has[sig[i]] = 1;
    var sr = tsSplit(raw), subj = tsTokens(sr.subject);
    var explicitShift = has["shift:yes"] || TS_FORGET.test(String(raw || ""));
    var wantsCarry = has["pron:yes"] || has["cont:yes"];
    if (explicitShift && subj.length) return { action: "reset", subject: sr.subject };
    if (explicitShift) return { action: "clear", subject: "" };
    if (subj.length >= 1 && !wantsCarry) {
      if (!this.subject) return { action: "set", subject: sr.subject };
      var overlap = 0;
      var prior = tsTokens(this.subject);
      for (i = 0; i < subj.length; i++)
        for (var j = 0; j < prior.length; j++) if (subj[i] === prior[j]) { overlap++; break; }
      if (!overlap) return { action: "reset", subject: sr.subject };
      return { action: "refine", subject: sr.subject };
    }
    if (wantsCarry && this.subject) return { action: "carry", subject: this.subject };
    if (subj.length) return { action: "set", subject: sr.subject };
    return { action: "hold", subject: this.subject };
  };

  /* Resolve an anaphor to the current subject, but only when there is a subject
     recent and confident enough to carry. A stale topic is worse than none. */
  DialogueState.prototype.resolve = function (raw) {
    var p = this.plan(raw);
    if (p.action === "carry" && this.confidence >= 0.35) {
      return { subject: this.subject, entity: this.entity, carried: true, action: p.action,
               evidenceSeen: this.evidenceSeen.slice(0, 24) };
    }
    if (p.action === "carry") return { subject: "", entity: "", carried: false, action: "hold" };
    return { subject: p.subject, entity: (p.action === "refine" ? this.entity : ""),
             carried: false, action: p.action };
  };

  function dialogueEvidenceSentences(result) {
    if (!result || !result.extractive || !result.answerText) return [];
    try { return C4Article.sentences(result.answerText).map(C4Article.clean).filter(Boolean); }
    catch (e) { return []; }
  }

  DialogueState.prototype.commit = function (raw, resolved, result) {
    this.turns++;
    var action = (resolved && resolved.action) || "hold";
    var failed = !!(result && result.insufficient);
    var freshEvidence = dialogueEvidenceSentences(result);
    if (failed && (resolved && resolved.elliptical)) {
      this.confidence *= 0.88;
      return this;
    }
    if (action === "clear") {
      this.prior.unshift({ s: this.subject, e: this.entity });
      this.subject = ""; this.entity = ""; this.relation = ""; this.confidence = 0; this.evidenceSeen = [];
    } else if (action === "reset" || action === "set") {
      if (this.subject) this.prior.unshift({ s: this.subject, e: this.entity });
      this.subject = resolved.subject || "";
      this.entity = failed ? "" : ((result && result.entity) || "");
      this.relation = failed ? "" : ((result && result.relation) || "");
      this.confidence = failed ? 0 : ((result && result.confidence) || 0);
      this.source = failed ? "" : ((result && result.source) || "");
      this.evidenceSeen = failed ? [] : freshEvidence.slice(0, 24);
    } else if (action === "refine" || action === "carry") {
      if (resolved.subject) this.subject = resolved.subject;
      if (result && result.entity) this.entity = result.entity;
      if (result && result.relation) this.relation = result.relation;
      if (result && result.confidence != null)
        /* Confidence decays with distance from the turn that established it. */
        this.confidence = Math.max(result.confidence, this.confidence * 0.7);
      else this.confidence *= 0.7;
      for (var ei = 0; ei < freshEvidence.length; ei++)
        if (this.evidenceSeen.indexOf(freshEvidence[ei]) < 0) this.evidenceSeen.push(freshEvidence[ei]);
      this.evidenceSeen = this.evidenceSeen.slice(-24);
    } else {
      this.confidence *= 0.8;
    }
    this.prior = this.prior.slice(0, 6);
    if (result && result.act) this.lastAct = result.act;
    return this;
  };

  /* ---------------------------------------------------- conversation engine
     The pack controls HOW to speak: which act an utterance is, and which
     authored plan answers that act. It never supplies WHAT is true, and it
     ships no dataset text at all, so there is nothing for it to copy. */

  function convActFeatures(text, state) {
    var s = String(text == null ? "" : text).trim();
    var words = s.match(/[A-Za-z0-9']+/g) || [];
    var feats = ["b"], i, markers = (convPack && convPack.markers) || [];
    var fired = [];
    for (i = 0; i < markers.length; i++) {
      var rx;
      try { rx = new RegExp(markers[i][1], "i"); } catch (e) { continue; }
      if (rx.test(s)) { feats.push("m|" + markers[i][0]); fired.push("m|" + markers[i][0]); }
    }
    var n = words.length;
    feats.push("n|" + (n <= 1 ? "0" : n <= 3 ? "1" : n <= 7 ? "2" : n <= 14 ? "3" : "4"));
    feats.push("p|" + (/\?$/.test(s) ? "q" : /!$/.test(s) ? "x" : "."));
    if (state) {
      feats.push("t|" + (!state.turns ? "0" : Number(state.turns) <= 2 ? "1" : "2"));
      if (state.lastAct) feats.push("a|" + state.lastAct);
    }
    for (i = 0; i < fired.length; i++)
      for (var j = i + 1; j < fired.length; j++) feats.push("c|" + fired[i] + "|" + fired[j]);
    return feats;
  }

  function convAct(text, state) {
    if (!convPack || !convPack.act_model || !convPack.act_model.weights) return null;
    var acts = convPack.act_model.acts || convPack.acts || [];
    if (!acts.length) return null;
    var feats = convActFeatures(text, state), logits = {}, i;
    for (i = 0; i < acts.length; i++) logits[acts[i]] = 0;
    for (i = 0; i < feats.length; i++) {
      var row = convPack.act_model.weights[feats[i]];
      if (!row) continue;
      for (var a in logits) { var v = row[a]; if (v) logits[a] += v; }
    }
    var p = tsSoftmax(logits), bestA = "", bestV = -1;
    for (var k in p) if (p[k] > bestV || (p[k] === bestV && k < bestA)) { bestV = p[k]; bestA = k; }
    return { act: bestA, p: bestV, dist: p };
  }

  function convRender(act, state, seed, avoid) {
    if (!convPack || !convPack.plans) return null;
    var plans = convPack.plans[act] || convPack.plans.smalltalk || [];
    var topic = String((state && state.subject) || "").trim();
    var usable = [], i;
    for (i = 0; i < plans.length; i++) {
      var needs = plans[i][1] || [];
      if (needs.indexOf("topic") >= 0 && !topic) continue;
      usable.push({ i: i, skel: plans[i][0] });
    }
    if (!usable.length) return null;
    var start = ((seed % usable.length) + usable.length) % usable.length;
    for (i = 0; i < usable.length; i++) {
      var pick = usable[(start + i) % usable.length];
      if (avoid != null && pick.i === avoid && usable.length > 1) continue;
      return { text: pick.skel.split("{topic}").join(topic), plan: pick.i };
    }
    var f = usable[start];
    return { text: f.skel.split("{topic}").join(topic), plan: f.i };
  }

  /* ============================================ evidence -> facts -> answer
   *
   * The old path was: pick the best sentence, rewrite a few phrases, print it.
   * That is retrieval deciding what the question meant, and it is why an
   * expanded compound title could answer a bare concept.
   *
   * The path below is the ASTRA shape applied to prose:
   *
   *     article -> evidence windows -> propositions -> answer plan -> sentence
   *
   * A proposition is a small typed record (subject, kind, predicate, qualifier,
   * source sentence index). Nothing reaches the answer that is not backed by a
   * proposition, and no proposition exists that was not read out of source
   * evidence. Generated text is never fed back as evidence for itself.
   * ================================================================== */

  /* The determiner is captured, not discarded. Dropping it produced "Math rock
     is style of rock music" -- a proposition that cannot be rendered into a
     grammatical sentence no matter what the plan does with it. */
  var PROP_DEF = /^\s*(?:the\s+)?(.{1,90}?)\s+(is|are|was|were)\s+(a|an|the)\s+(.{3,240}?)\s*[.;]?\s*$/i;
  var PROP_DEF_BARE = /^\s*(?:the\s+)?(.{1,90}?)\s+(is|are|was|were)\s+(.{3,240}?)\s*[.;]?\s*$/i;
  var PROP_ALIAS = /\b(?:also (?:known|called|referred to)(?:\s+as)?|abbreviated|short for|sometimes called)\s+(.{2,90}?)\s*[,.;)]/i;
  var PROP_RELCLAUSE = /,\s*(?:which|who|that)\s+(.{5,200}?)\s*[,.;]/i;

  /* Prose that is about the page rather than about the subject. Rejected before
     anything is scored, so a navigation line can never become a "fact". */
  var META_PROSE = /\b(?:this article|this page|see also|for other uses|may refer to|disambiguation|citation needed|retrieved on|external links|main article|redirects here)\b/i;
  var LIST_PROSE = /^\s*(?:list of|index of|outline of|timeline of|category:|portal:)/i;

  function propKind(sentence, index) {
    var s = String(sentence || "");
    if (/\b(?:born|died|founded|established|released|launched|invented|discovered)\b/i.test(s))
      return "event";
    if (/\b(?:because|due to|as a result|therefore|causes?|results? in|arises? from)\b/i.test(s))
      return "cause";
    if (/\b(?:works? by|operates? by|through which|via which|mechanism|process by which|by using|through)\b/i.test(s))
      return "mechanism";
    if (/\b(?:for example|for instance|such as|examples? include)\b/i.test(s)) return "example";
    if (/\b(?:consists|comprises|contains|includes|made up of|composed of)\b/i.test(s))
      return "composition";
    if (/\b(?:used|use[sd]?|applies|applied|serves|purpose|applications?)\b/i.test(s)) return "use";
    if (index === 0 || /\b(?:is|are|was|were|refers to|describes|means)\b/i.test(s))
      return "definition";
    return "detail";
  }

  /* Read a small set of typed propositions out of evidence sentences. This is
     extraction, not generation: every field is a slice of a source sentence. */
  function extractPropositions(evidence, title, analysis, aliases) {
    var props = [], i, m;
    /* An article often names itself differently from the term the user typed:
       "high school" reaches an article whose first sentence starts "A secondary
       school is ...". Matching only against the display title made every such
       article fall through to the untyped branch, and the answer then read
       "High school - A secondary school is ...". Every known name of the page
       counts as its subject. */
    var names = [title].concat(aliases || []).filter(Boolean);
    /* Same profile idea as the evidence reader: a supporting sentence stays on
       topic by sharing the article's own vocabulary, not by naming the subject
       again. Without this every support proposition scored zero and a
       definition answer was one sentence long. */
    var prof = articleProfile(title, evidence, analysis);
    function subjectMatches(v) {
      for (var k = 0; k < names.length; k++) if (identityLooseMatch(v, names[k])) return true;
      return false;
    }
    for (i = 0; i < evidence.length && props.length < 10; i++) {
      var s = txtOf(evidence[i]);
      if (!s || s.length < 18) continue;
      if (META_PROSE.test(s)) continue;
      var kind = propKind(s, i), rec = null;
      m = s.match(PROP_DEF);
      if (m && subjectMatches(m[1])) {
        rec = { subject: txtOf(m[1]), copula: m[2].toLowerCase(),
                determiner: m[3].toLowerCase(), predicate: txtOf(m[4]),
                kind: "definition", i: i, src: s };
      }
      if (!rec) {
        m = s.match(PROP_DEF_BARE);
        if (m && subjectMatches(m[1])) {
          rec = { subject: txtOf(m[1]), copula: m[2].toLowerCase(),
                  determiner: "", predicate: txtOf(m[3]), kind: "definition", i: i, src: s };
        }
      }
      if (!rec) rec = { subject: title, copula: "", determiner: "",
                        predicate: "", kind: kind, i: i, src: s };
      m = s.match(PROP_ALIAS);
      if (m && m[1]) rec.alias = txtOf(m[1]);
      m = s.match(PROP_RELCLAUSE);
      if (m && m[1]) rec.qualifier = txtOf(m[1]);
      /* Early article sentences are part of the article's own opening context
         even when they use a derived technical word instead of repeating the
         title (e.g. a property of an entangled system). Give only a small
         position prior; lexical/topic evidence still dominates. This gives
         continuations somewhere grounded to go without admitting deep-page
         trivia wholesale. */
      var openingPrior = i < 7 ? Math.max(0.18, 0.28 - 0.015 * i) : 0;
      rec.topic = Math.max(sentenceTopicScore(analysis, s), profileOverlap(prof, s), openingPrior);
      props.push(rec);
    }
    return props;
  }

  function identityLooseMatch(a, b) {
    if (identityEqual(a, b)) return true;
    var at = identityTokens(a), bt = identityTokens(b), i, j, hit = 0;
    if (!at.length || !bt.length) return false;
    for (i = 0; i < at.length; i++)
      for (j = 0; j < bt.length; j++) if (at[i] === bt[j]) { hit++; break; }
    return hit / at.length >= 0.6 || hit / bt.length >= 0.6;
  }

  /* An answer PLAN: which propositions, in which order, for which intent.
     A definition leads with what the thing IS. It does not lead with history,
     etymology, a same-named film, or trivia -- those are `detail` and `event`
     propositions and the plan puts them after the definition or not at all. */
  function buildAnswerPlan(family, props, analysis, title, opts) {
    var lead = null, support = [], i;
    var skip = (opts && opts.skipLead) ? 1 : 0;
    /* A continuation must move past what was already used, but must not skip
       twice. The previous planner sliced once and then skipped another
       definition, which could make a follow-up jump over the best evidence. */
    if (skip && props.length > skip) props = props.slice(skip);
    var wantEvent = family === "identity" || /\b(?:when|born|founded|died|released)\b/i.test(analysis.raw || "");
    var priorNorm = normalizeAnswer(opts && opts.priorText || "");
    function alreadySaid(p) {
      var n = normalizeAnswer(p && p.src || "");
      return !!(priorNorm && n && priorNorm.indexOf(n) >= 0);
    }

    /* Pick the strongest defining proposition, not merely the first sentence
       that happens to parse as a definition. This is a deterministic evidence
       decision: topic fit + definition structure + an early-lead prior. */
    var bestLeadScore = -Infinity;
    for (i = 0; i < props.length; i++) {
      var p = props[i];
      if (p.kind !== "definition" || !p.predicate || alreadySaid(p)) continue;
      var leadScore = 2.4 + 2.6 * Number(p.topic || 0) + 0.7 / (1 + Number(p.i || i));
      if (p.alias) leadScore += 0.15;
      if (leadScore > bestLeadScore) { bestLeadScore = leadScore; lead = p; }
    }
    if (!lead) {
      /* No copular proposition survived. Use the most on-topic source sentence
         rather than inventing a definition. */
      for (i = 0; i < props.length; i++) {
        var weak = props[i];
        if (alreadySaid(weak)) continue;
        var weakScore = 2.2 * Number(weak.topic || 0) + 0.45 / (1 + Number(weak.i || i));
        if (!lead || weakScore > bestLeadScore) { lead = weak; bestLeadScore = weakScore; }
      }
    }

    /* Supporting evidence is selected iteratively for relevance AND novelty.
       It stays fully extractive: the score only decides which source sentence
       to include. Near-duplicates and off-topic trivia are discarded. */
    var pool = props.filter(function (q) { return q !== lead && !alreadySaid(q) && Number(q.topic || 0) >= 0.18; });
    var kindSeen = Object.create(null);
    if (lead) kindSeen[lead.kind || "detail"] = 1;
    var askRaw = String(analysis && analysis.raw || "");
    var preferCause = /\b(?:why|cause|reason)\b/i.test(askRaw);
    var preferMechanism = /\b(?:how|mechanism|process|works?|working)\b/i.test(askRaw);
    var preferUse = /\b(?:use|uses|used|application|applications|purpose)\b/i.test(askRaw);
    var preferExample = /\b(?:example|examples|instance|instances)\b/i.test(askRaw);
    while (pool.length && support.length < 4) {
      var bestIdx = -1, bestScore = -Infinity;
      for (i = 0; i < pool.length; i++) {
        var q = pool[i], qText = C4Article.clean(q.src || ""), redundant = false, j;
        if (!qText) continue;
        if (!wantEvent && q.kind === "event" && support.length >= 1) continue;
        if (lead && answerAgreement(qText, C4Article.clean(lead.src || "")) >= 0.72) continue;
        for (j = 0; j < support.length; j++) {
          if (answerAgreement(qText, C4Article.clean(support[j].src || "")) >= 0.76) { redundant = true; break; }
        }
        if (redundant) continue;
        var score = 2.8 * Number(q.topic || 0) + 0.45 / (1 + Number(q.i || i));
        if (!kindSeen[q.kind || "detail"]) score += 0.32;
        if (q.kind === "use" || q.kind === "composition") score += 0.18;
        if (preferCause && q.kind === "cause") score += 1.15;
        if (preferMechanism && (q.kind === "mechanism" || q.kind === "cause")) score += 1.0;
        if (preferUse && q.kind === "use") score += 1.15;
        if (preferExample && q.kind === "example") score += 1.05;
        if (q.kind === "event" && !wantEvent) score -= 0.22;
        if (q.alias || q.qualifier) score += 0.08;
        if (score > bestScore) { bestScore = score; bestIdx = i; }
      }
      if (bestIdx < 0) break;
      var chosen = pool.splice(bestIdx, 1)[0];
      support.push(chosen); kindSeen[chosen.kind || "detail"] = 1;
    }
    /* Keep the definition first, then restore source order among support facts
       so a longer answer still reads coherently. */
    support.sort(function (a, b) { return Number(a.i || 0) - Number(b.i || 0); });
    return { family: family, title: title, lead: lead, support: support,
             grounded: !!lead, count: props.length,
             reasoning: { method: "evidence-plan", supportCount: support.length,
                          leadKind: lead ? lead.kind : "none" } };
  }

  function synthesizeFromPlan(plan, analysis, evidence) {
    if (!plan || !plan.lead) return "";
    // Propositions guide selection, but do not license rewriting a subject,
    // tense, modifier attachment, negation, or technical term.
    var chosen = [plan.lead].concat(plan.support || []), seen = new Set();
    return chosen.map(function (p) { return C4Article.clean(p.src); })
      .filter(function (text) {
        if (!text || seen.has(text)) return false;
        seen.add(text); return true;
      }).join("\n\n");
  }

  /* ------------------------------------------- rows -> tiered candidates
     The federation returns rows; the ladder needs candidates. This is the only
     place the two representations meet, and it copies rather than mutates so a
     row's original fields survive for the existing scorers. */
  function rowsToCandidates(rows, analysis) {
    var out = [], i;
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      out.push({
        row: r,
        title: r.h || "",
        text: r.t || "",
        alias: r.wikiAlias || "",
        verifiedTitle: !!r.wikiExact,
        disambiguation: !!r.wikiDisambiguation,
        fullText: !!r.wikiRead,
        coherence: topicCoherenceScore(analysis, r),
        concentration: topicNeighborhoodScore(analysis, r),
        source: String(r.o || r.d || "unknown"),
        rank: Number(r.sourceRank == null ? 9 : r.sourceRank)
      });
    }
    return out;
  }

  /* The full resolution pass. Grammar proposes families; the model weights
     them; the ladder prunes; the model orders what survived; the ordering never
     crosses a tier. Returns null when the bridge is not available, and every
     caller treats null as "use the path that shipped before". */
  function resolveSenses(question, rows, state) {
    var analysis = analyzeQuestion(question);
    var sr = tsSplit(question);
    var asked = sr.subject || analysis.lookup || analysis.subject || "";
    if (state && state.carried && state.subject) asked = state.subject;
    /* Two subject hypotheses when an article was stripped. Whichever reaches a
       better identity tier is the one the user meant. */
    var askedAlt = (sr.subjectAlt && sr.subjectAlt.toLowerCase() !== asked.toLowerCase()) ?
      sr.subjectAlt : "";

    var fam = familyDist(question, state, lexicon);
    var family = "", bestP = -1;
    for (var k in fam) if (fam[k] > bestP || (fam[k] === bestP && k < family)) { bestP = fam[k]; family = k; }
    var focused = (family === "definition" || family === "identity") && !!asked;
    var cands = rowsToCandidates(rows || [], analysis);
    var pruned = pruneByTier(asked, cands, focused);
    if (askedAlt) {
      var altCands = rowsToCandidates(rows || [], analysis);
      var altPruned = pruneByTier(askedAlt, altCands, focused);
      /* Better tier wins outright. At the same tier, the hypothesis whose best
         candidate is a real article beats one whose best candidate is a
         disambiguation page -- "the matrix" naming an actual film is a stronger
         reading than "matrix" naming a list of meanings. */
      var topOf = function (pr) {
        var best = null, k;
        for (k = 0; k < pr.kept.length; k++)
          if (!best || pr.kept[k].tier > best.tier) best = pr.kept[k];
        return best;

      var a0 = topOf(pruned), a1 = topOf(altPruned);
      if (altPruned.best > pruned.best ||
          (altPruned.best === pruned.best && a0 && a1 &&

    var qsigs = tsSignatures(question, state, lexicon), i;
    for (i = 0; i < pruned.kept.length; i++) {
      var c = pruned.kept[i];
      c.csig = candidateSignature(asked, c);
      c.modelScore = candidateScore(qsigs, c.csig);
    }
    /* Tier first, always. The learned score orders inside a tier and nowhere
       else, which is what keeps feedback from redefining semantic validity.
       For a relational question the deterministic score that shipped before
       this bridge stays the primary within-tier order, so adding the ladder
       cannot reshuffle an answer path that already worked. */
    pruned.kept.sort(function (a, b) {
      var ar = (a.row && a.row.r) || 0, br = (b.row && b.row.r) || 0;
      if (b.tier !== a.tier) return b.tier - a.tier;
      if (focused) return (b.modelScore - a.modelScore) || (br - ar);
      return (br - ar) || (b.modelScore - a.modelScore);
    });

      family = "sense_undisclosed";

    else if (pruned.kept[0].disambiguation) family = "ambiguous";

             family: family, familyDist: fam, bestTier: pruned.best,
             candidates: pruned.kept, focused: focused, qsigs: qsigs };
  }

  function siteLexicon() {

               "inquire", "cell4.art", "agency"], i;
    var ps = (brain && brain.passages) || [];
    for (i = 0; i < ps.length && out.length < 60; i++)
      if (ps[i] && ps[i].h) out.push(String(ps[i].h));
    return out;

  /* ------------------------------------------------ general conversation
   * A normal chat should not be sent to encyclopedias. This corpus layer is
   * retrieval-only and deliberately isolated from factual research. It loads
   * the BSD-licensed ChatterBot English conversation/greeting files through
   * GitHub's public Contents API (no key), caches them locally, and falls back
   * to raw public files or tiny built-in replies if the network is unavailable. */

  var CHAT_CACHE_TTL = 7 * 24 * 3600 * 1000;
  var CHAT_API_FILES = [
    { api: "https://api.github.com/repos/gunthercox/chatterbot-corpus/contents/chatterbot_corpus/data/english/conversations.yml?ref=master",
      raw: "https://raw.githubusercontent.com/gunthercox/chatterbot-corpus/master/chatterbot_corpus/data/english/conversations.yml" },
    { api: "https://api.github.com/repos/gunthercox/chatterbot-corpus/contents/chatterbot_corpus/data/english/greetings.yml?ref=master",
      raw: "https://raw.githubusercontent.com/gunthercox/chatterbot-corpus/master/chatterbot_corpus/data/english/greetings.yml" }
  ];

  /* Corpus replies are untrusted user-contributed text. Keep a compact safety
     screen at the boundary so an unrelated risky line can never surface just
     because it happens to be lexically similar to casual chat. */
  var CHAT_UNSAFE = /\b(?:suicide|self[- ]?harm|kill myself|overdose|heroin|cocaine|meth(?:amphetamine)?|fentanyl|vape|cigarette|nicotine|vodka|whiskey|beer|wine|casino|sportsbook|betting|gambling|porn|sex toy|gun|firearm|ammunition|knife|weapon|explosive)\b/i;

  function decodeBase64Utf8(s) {
    try {
      var bin = atob(String(s || "").replace(/\s+/g, "")), bytes = new Uint8Array(bin.length);

      var esc = ""; for (i = 0; i < bytes.length; i++) esc += "%" + ("0" + bytes[i].toString(16)).slice(-2);
      return decodeURIComponent(esc);

  function yamlScalar(v) {
    v = String(v == null ? "" : v).trim();
    if (!v) return "";
    if (v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
      try { return JSON.parse(v); } catch (e) {}
    }
    if (v.charAt(0) === "'" && v.charAt(v.length - 1) === "'")
      return v.slice(1, -1).replace(/''/g, "'");
    return v;
  }

  function parseChatterYaml(text) {
    var lines = String(text || "").replace(/\r/g, "").split("\n"), conversations = [];
    var inConversations = false, cur = null;
    function flush() { if (cur && cur.length >= 2) conversations.push(cur); cur = null; }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^conversations\s*:\s*$/.test(line.trim())) { inConversations = true; continue; }
      if (!inConversations) continue;
      var first = line.match(/^\s*-\s*-\s+(.+)$/);
      if (first) { flush(); cur = [yamlScalar(first[1])]; continue; }
      var more = line.match(/^\s{1,}-\s+(.+)$/);
      if (more && cur) { cur.push(yamlScalar(more[1])); continue; }
      /* YAML allows a plain scalar to continue on more-indented lines. Keep the
         continuation attached to the previous utterance so the corpus can never
         learn or emit a sentence that was chopped merely by source formatting. */
      var cont = line.match(/^\s{3,}(\S.*)$/);
      if (cont && cur && cur.length) {
        cur[cur.length - 1] = txtOf(cur[cur.length - 1] + " " + yamlScalar(cont[1]));
        continue;
      }
      if (/^[A-Za-z_][A-Za-z0-9_-]*\s*:/.test(line) && line.trim() !== "conversations:") { flush(); inConversations = false; }
    }

  }

  function charTrigrams(s) {
    s = normalizeAnswer(s).replace(/\s+/g, " "); var out = Object.create(null);
    if (s.length < 3) { if (s) out[s] = 1; return out; }
    for (var i = 0; i <= s.length - 3; i++) out[s.slice(i, i + 3)] = 1;
    return out;
  }

  function diceTrigram(a, b) {
    var x = charTrigrams(a), y = charTrigrams(b), nx = 0, ny = 0, hit = 0, k;
    for (k in x) { nx++; if (y[k]) hit++; }

    var an = normalizeAnswer(a), bn = normalizeAnswer(b);
    if (!an || !bn) return 0;

    var at = uniqTokens(a), bt = uniqTokens(b), hit = 0;
    for (var i = 0; i < at.length; i++) if (tokenHas(bt, at[i])) hit++;
    var jac = hit / Math.max(1, at.length + bt.length - hit);
    var cover = hit / Math.max(1, Math.min(at.length, bt.length));
    var tri = diceTrigram(a, b);
    return Math.max(0, Math.min(1, 0.42 * jac + 0.30 * cover + 0.28 * tri));

  function looksConversational(text) {
    var s = txtOf(text || ""), low = s.toLowerCase();
    if (!s) return false;
    if (/\b(cell4|robots\.js|proof of work|inquire|agency|community)\b/i.test(s)) return false;
    if (/^(?:what|who|where|when|which)\s+(?:is|are|was|were|does|do|did|has|have|can|could|would)\b/i.test(s) &&
        !/^(?:what['’]?s up|what is up)\b/i.test(s)) return false;
    if (/^(?:define|describe|explain|list|show|calculate|solve|compare|search|look up|find|how to|why is|why are|why does|why do)\b/i.test(s)) return false;
    if (/\b(?:capital of|population of|author of|founded|born|headquarters|weather|price of|definition of)\b/i.test(s)) return false;
    if (/\b(?:how are you|how['’]?s it going|how have you been|what['’]?s up|nice to meet|good morning|good evening|good night|can we talk|let['’]?s talk|tell me something|what do you think|do you like|favorite|i feel|i['’]?m |i am |i think|i guess|i had |my day|bored|lol|haha|lmao|that['’]?s |sounds good|fair enough)\b/i.test(low)) return true;
    /* Short non-command statements are usually social context, not research

  }

  function ConversationCorpus() {
    this.pairs = []; this.ready = false; this.loading = false; this.failed = false;
    this.lastBot = ""; this.lastReply = "";
    try {
      var c = JSON.parse(localStorage.getItem(CHAT_CACHE_KEY) || "null");
      if (c && Array.isArray(c.pairs) && c.pairs.length && Date.now() - c.t < CHAT_CACHE_TTL) {
        this.pairs = c.pairs; this.ready = true;
      }

  }

  ConversationCorpus.prototype.ingest = function (conversations) {
    var pairs = this.pairs.slice(), seen = Object.create(null);
    for (var z = 0; z < pairs.length; z++) seen[normalizeAnswer(pairs[z].q) + "|" + normalizeAnswer(pairs[z].a)] = 1;
    for (var i = 0; i < (conversations || []).length; i++) {
      var c = conversations[i] || [];
      for (var j = 0; j + 1 < c.length; j++) {
        var qv = txtOf(c[j]), av = txtOf(c[j + 1]), ctx = j > 0 ? txtOf(c[j - 1]) : "";
        if (!qv || !av || qv.length > 260 || av.length > 320 || CHAT_UNSAFE.test(qv) || CHAT_UNSAFE.test(av)) continue;
        var key = normalizeAnswer(qv) + "|" + normalizeAnswer(av);
        if (seen[key]) continue;
        seen[key] = 1; pairs.push({ q: qv, a: av, ctx: ctx });
      }

  };

  ConversationCorpus.prototype.loadOne = function (def) {
    return fetch(def.api, { referrerPolicy: "no-referrer" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) {
        var text = j && j.encoding === "base64" ? decodeBase64Utf8(j.content) : "";

        return text;
      })
      .catch(function () {
        return fetch(def.raw, { referrerPolicy: "no-referrer" }).then(function (r) {
          return r.ok ? r.text() : Promise.reject(r.status);

      return self.loadOne(d).catch(function () { return ""; });
    })).then(function (texts) {
      for (var i = 0; i < texts.length; i++) if (texts[i]) self.ingest(parseChatterYaml(texts[i]));
      self.ready = self.pairs.length > 0; self.failed = !self.ready; self.loading = false;
      if (self.ready) {

  function casualFallback(text) {
    var s = txtOf(text || "").toLowerCase();
    if (/\b(?:how are you|how['’]?s it going|how have you been)\b/.test(s))
      return "Doing well. What are you working on or thinking about?";
    if (/\b(?:bored|nothing to do)\b/.test(s))
      return "We can fix that. Give me a topic, project, or random idea and I’ll run with it.";
    if (/\b(?:can we talk|let['’]?s talk)\b/.test(s))
      return "Yeah. What do you want to talk about?";
    if (/\b(?:lol|haha|lmao)\b/.test(s)) return "Yeah, fair enough.";
    if (/\b(?:i feel|i['’]?m|i am|my day|i had)\b/.test(s))

  /* ------------------------------------------- routing + anaphora helpers */

  /* Rewrite an anaphoric or bare-continuation turn into an explicit question
     before anything is retrieved. Retrieval must never be the thing that
     decides what "he" meant. */
  function rewriteWithSubject(text, subject) {
    var t = txtOf(text), subj = txtOf(subject);
    if (!subj) return t;
    var raw = tsRawTokens(t);
    /* "tell me more" plus the subject would parse as the relation "more" OF the
       subject, which is not a relation at all. Re-ask the concept cleanly and
       let the answer plan skip what was already said. */
    if (tsHasAny(raw, TS_CONT) && raw.length <= 5) {
      var meaningful = raw.filter(function (w) {
        return TS_CONT.indexOf(w) < 0 && !/^(?:tell|show|give|me|on|about|the|a|an|please)$/.test(w);
      });
      if (meaningful.length) return subj + " " + meaningful.join(" ");
      return "tell me about " + subj;

    if (/^\s*(?:why|how|when|where|who|what|which)\s*[?!.]*\s*$/i.test(t))
      return t.replace(/[?!.]+\s*$/, "").trim() + " " + subj + "?";
    var modifier = t.match(/^\s*(?:what|which)\s+(?:is|are|was|were)\s+(?:it|they|this|that|these|those)\s+(.+?)[?!.]*\s*$/i);
    if (modifier && modifier[1]) return subj + " " + txtOf(modifier[1]).replace(/[?!.]+$/, "");
    modifier = t.match(/^\s*(?:what|which)\s+(?:does|do|did)\s+(?:it|they|this|that|these|those)\s+(.+?)[?!.]*\s*$/i);
    if (modifier && modifier[1]) return subj + " " + txtOf(modifier[1]).replace(/[?!.]+$/, "");
    var re = /\b(he|she|it|they|him|her|them|his|hers|their|theirs|its|that|this|those|these|one)\b/i;
    if (re.test(t)) return t.replace(re, subj);

  /* A hard guard above the learned router, in the same spirit as the identity

  function conversationalAllowedHard(text) {
    var form = tsQueryForm(text);
    if (form === "meta" || form === "social") return true;
    if (form !== "bare" && form !== "bare_q") return false;
    var sr = tsSplit(text), raw = tsRawTokens(text);
    if (!sr.subject) return true;
    if (tsHasAny(raw, TS_CONVO) || TS_SOCIAL_PHRASE.test(text)) return true;
    if (tsHasAny(raw, TS_PRON) && tsTokens(sr.subject).length <= 2) return true;
    if (tsHasAny(raw, TS_CONT) && raw.length <= 5) return true;

     as everyone else, or it is retrieval deciding the question again. */

    if (!passage) return true;

        form !== "tellme" && form !== "bare" && form !== "bare_q") return true;
    var asked = tsSplit(text).subject;
    if (!asked) return true;
    var lex = siteLexicon();
    /* If the question names the site's own vocabulary, the site is the
       authority and no further test applies. */

    var t = senseTier(asked, { title: passage.h || "", text: passage.t || "",

  function conversationalReply(text, snap) {

    if (a && a.act && a.p >= 0.30) {
      var r = null;
      try {
        r = convRender(a.act, snap, dialogue ? dialogue.turns : 0,
                       dialogue ? dialogue.lastPlan : -1);
      } catch (e) { r = null; }
      if (r && r.text) {
        if (dialogue) dialogue.lastPlan = r.plan;

                 act: a.act, actP: Math.round(a.p * 1000) / 1000 };

  /* ------------------------------------------------------------------- ui */
  var brain = new Brain(B), learner, fed, reasoner, convo, dialogue, webAlways = false;

  /* A code block with its language, a copy button, and nothing pretending to

  function codeBlock(code, label, ran, language, explain) {
    var box = el("div", "c4-code");
    var head = el("div", "c4-code-head");
    var left = el("span", null, label || "");
    head.appendChild(left);
    if (ran) {
      var badge = el("span", "c4-badge ran", "executed");
      head.appendChild(badge);
    }
    var copy = el("button", "c4-copy", "copy");
    copy.type = "button";
    copy.addEventListener("click", function () {
      var done = function () {
        copy.textContent = "copied";
        setTimeout(function () { copy.textContent = "copy"; }, 1400);
      };

        navigator.clipboard.writeText(code).then(done, function () {});
      } else {

        ta.value = code;
        document.body.appendChild(ta);
        ta.select();

    var codeEl = el("code", "language-" + (language || "text"), explain ? "" : code);
    codeEl.dataset.language = language || "text";

       the answer comes from the IR node that emitted it, so it is specific to
       this line rather than to lines that look like it. */

      panel.appendChild(el("span", "c4-exp-hint",
        "Click any line (or tab to it) to see what it does."));
      var rows = code.replace(/\n$/, "").split("\n");
      var selected = null;
      rows.forEach(function (text, i) {
        var n = i + 1;
        var row = el("span", "c4-line");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", "Explain line " + n);
        var num = el("span", "c4-line-n", String(n));
        row.appendChild(num);
        row.appendChild(document.createTextNode(text + "\n"));

          if (selected) selected.className = "c4-line";
          selected = row;
          row.className = "c4-line sel";
          renderExplanation(panel, explain(n), n);
        }
        row.addEventListener("click", choose);
        row.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); choose(); }
        });
        codeEl.appendChild(row);
      });
      pre.appendChild(codeEl);
      box.appendChild(pre);
      box.appendChild(panel);
      return box;
    }

    pre.appendChild(codeEl);
    box.appendChild(pre);
    return box;
  }

  /* Render one line's explanation. Everything shown here was derived by the
