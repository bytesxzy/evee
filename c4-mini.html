  function renderExplanation(panel, exp, n) {
    panel.textContent = "";
    if (!exp || !exp.ok) {
      panel.appendChild(el("span", "c4-exp-hint",
        (exp && exp.error) || "No explanation is available for line " + n + "."));
      return;
    }
    panel.appendChild(el("h5", null, "Line " + exp.line + " \u00b7 " + exp.headline));
    if (exp.why) panel.appendChild(el("div", "c4-exp-why", exp.why));

    var dl = el("dl");
    function row(term, text) {
      dl.appendChild(el("dt", null, term));
      dl.appendChild(el("dd", null, text));
    }
    (exp.writes || []).forEach(function (w) {
      row("sets", w.name + " \u2192 " + w.holds);
    });
    (exp.reads || []).forEach(function (r) {
      row("uses", r.name + " (" + r.from + ") \u2014 " + r.holds);
    });
    (exp.calls || []).forEach(function (c) {
      row("calls", c.name + " \u2014 " + c.what);
    });
    if (dl.children.length) panel.appendChild(dl);

    (exp.notes || []).forEach(function (t) {
      panel.appendChild(el("div", "c4-exp-note", t));
    });
  }

  /* Everything the reasoner produced, laid out so the answer is first and the
     working is one click away. */
  function renderReasoned(m, r) {
    if (r.how && r.how.length) {
      var ol = el("ol", "c4-steps");
      r.how.slice(0, 5).forEach(function (step) {
        ol.appendChild(el("li", null, step));
      });
      m.appendChild(ol);
    }
    if (r.code) {
      var label = (r.languageName || r.language || "").toString();
      if (r.route === "compute") label = label + " \u00b7 derived for this question";
      m.appendChild(codeBlock(r.code, label, r.verified === true, r.language,
        typeof r.explainLine === "function" ? r.explainLine : null));
    }
    if (r.output && String(r.output).trim() && r.route !== "compute") {
      m.appendChild(el("div", "c4-out", String(r.output).replace(/\n+$/, "")));
    }
    if (r.emitNote) m.appendChild(el("div", "also", r.emitNote));
    if (r.complexity) {
      m.appendChild(el("div", "also",
        "Complexity: " + r.complexity.time +
        (r.complexity.space ? " time, " + r.complexity.space + " space" : "")));
    }
    if (r.notes && r.notes.length) {
      r.notes.slice(0, 2).forEach(function (n) {
        m.appendChild(el("div", "also", n));
      });
    }
    if (r.route === "code" && r.verified === false && !r.error) {
      m.appendChild(el("div", "also",
        "Not executed here \u2014 the browser has no " +
        (r.languageName || r.language) + " runtime."));
    }
    var why = el("details", "c4-why");
    why.appendChild(el("summary", null, "how I got this"));
    (r.why || []).forEach(function (w) { why.appendChild(el("p", null, w)); });
    /* Only ever a string here. A build once put a function on this field
       and the page printed its source into the transcript. */
    if (typeof r.explain === "string" && r.explain) {
      why.appendChild(el("p", null, r.explain));
    }
    if (r.ms != null) {
      why.appendChild(el("p", null, "Ran in " + r.ms + " ms on this machine."));
    }
    if (r.languagesAvailable) {
      why.appendChild(el("p", null,
        "Ask for it in any of: " + r.languagesAvailable.join(", ") + "."));
    }
    m.appendChild(why);
  }

  function bot(a, question) {
    var m = el("div", "msg bot");
    m.appendChild(document.createTextNode(a.text));
    if (a.reasoned) renderReasoned(m, a.reasoned);
    if (a.also) m.appendChild(el("div", "also", "Also: " + a.also));
    if (a.used && a.used.length) {
      var via = el("div", "ext");
      via.appendChild(el("span", null, "Sources: "));
      a.used.forEach(function (label, i) {
        if (i) via.appendChild(document.createTextNode(", "));
        via.appendChild(el("b", null, label));
      });
      m.appendChild(via);
    }
    if (a.sources && a.sources.length) {
      var meta = el("div", "meta");
      (a.sources || []).filter(function (s, i, arr) { return s && arr.indexOf(s) === i; })
        .slice(0, 5).forEach(function (s, i) {
          var link = el("a", "src", (a.claims ? "[" + (i+1) + "] " : "") + sourceLabel(s));
          link.href = s; link.target = "_top"; link.rel = "noopener";
          try {
            var sourceUrl = new URL(s, document.baseURI);
            if (/^https?:$/.test(sourceUrl.protocol)) {
              var icon = el("span", "source-icon", "◎");
              icon.setAttribute("aria-hidden", "true");
              var favicon = document.createElement("img");
              favicon.alt = "";
              favicon.loading = "lazy";
              favicon.referrerPolicy = "no-referrer";
              favicon.addEventListener("error", function () { icon.textContent = "◎"; });
              favicon.src = sourceUrl.origin + "/favicon.ico";
              icon.textContent = "";
              icon.appendChild(favicon);
              link.insertBefore(icon, link.firstChild);
            }
          } catch (e) { /* Keep the source label usable if its URL is invalid. */ }
          meta.appendChild(link);
        });
      m.appendChild(meta);
    }
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
  }

  /* CELL4 prompts always use the dataset. Other prompts retain the existing
     local-answer checks, public search fallback and globe-button override. */
  var WEB_ASKED = /\b(search|look ?up|google|web|internet|online|wikipedia|wikidata|duckduckgo|ddg)\b/i;

  function genericContinuationOnly(rawText) {
    var raw = tsRawTokens(rawText);
    if (!raw.length || raw.length > 6 || !tsHasAny(raw, TS_CONT)) return false;
    var meaningful = raw.filter(function (w) {
      return TS_CONT.indexOf(w) < 0 && !/^(?:tell|show|give|me|on|about|the|a|an|please)$/.test(w);
    });
    return meaningful.length === 0;
  }

  function contextualFallbackQuery(rawText, snap) {
    if (!snap || !snap.subject || Number(snap.confidence || 0) < 0.35) return "";
    var rawTokens = tsRawTokens(rawText), form = tsQueryForm(rawText);
    if (!rawTokens.length || rawTokens.length > 6 || tsHasAny(rawTokens, TS_SHIFT) || TS_FORGET.test(String(rawText || ""))) return "";
    if (TS_SOCIAL_PHRASE.test(String(rawText || "")) || tsHasAny(rawTokens, TS_CONVO)) return "";
    var cleaned = rawTokens.filter(function (w) {
      return TS_CONT.indexOf(w) < 0 && TS_PRON.indexOf(w) < 0 && !/^(?:tell|show|give|and|also|more|further|next|please|me|about|on|the|a|an)$/.test(w);
    });
    if (/^(?:why|how|when|where|who|what|which)$/.test(cleaned.join(" ")))
      return cleaned.join(" ") + " " + snap.subject + "?";
    if (!cleaned.length) return "tell me about " + snap.subject;
    /* Use a non-question search phrase for nominal ellipsis. That keeps the
       established entity as the retrieval anchor without pretending the whole
       fragment is a new named concept. */
    if (form === "bare" || form === "bare_q" || tsHasAny(rawTokens, TS_CONT))
      return snap.subject + " " + cleaned.join(" ");
    return rewriteWithSubject(rawText, snap.subject);
  }

  function ask(text) {
    log.appendChild(el("div", "msg me", text));
    var wait = el("div", "msg bot think");
    wait.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(wait);
    log.scrollTop = log.scrollHeight;

    /* Dialogue state is resolved BEFORE retrieval, so "when was he born" is
       already an explicit question by the time any source sees it, and an
       explicit topic shift has already thrown the old subject away. */
    var snap = dialogue ? dialogue.snapshot() : null;
    var resolved = dialogue ? dialogue.resolve(text) :
      { subject: "", entity: "", carried: false, action: "set" };
    var effective = resolved.carried && resolved.subject ?
      rewriteWithSubject(text, resolved.subject) : text;
    if (resolved.carried) {
      var contRaw = tsRawTokens(text), contForm = tsQueryForm(text);
      resolved.continuation = (tsHasAny(contRaw, TS_CONT) && contRaw.length <= 5) ||
        (contRaw.length <= 7 && contForm !== "whatis" && contForm !== "whois");
      resolved.noveltyOnly = genericContinuationOnly(text);
      resolved.evidenceSeen = (snap && snap.evidenceSeen) ? snap.evidenceSeen.slice() : [];
    }

    function land(a) {
      if (wait.parentNode) log.removeChild(wait);
      a = a || { text: casualFallback(text), sources: [] };
      if (!a.text) a.text = casualFallback(text);
      lastAnswer = { q: text, effective: effective, a: a };
      bot(a, text);
      if (dialogue && !a.skipDialogue) {
        var top = (a.research && a.research.row) || null;
        dialogue.commit(text, resolved, {
          entity: (top && (top.wikiTargetTitle || top.h)) || a.entity || "",
          relation: a.relation || "",
          confidence: a.conversational ? 0.15 :
                      (top ? (top.wikiExact ? 0.95 : 0.6) : (a.hit ? 0.7 : 0.3)),
          act: a.act || "",
          source: (a.used && a.used[0]) || (a.hit ? "site" : ""),
          insufficient: !!(a.insufficientEvidence || a.clarification),
          extractive: !!a.extractive, answerText: a.text || ""
        });
      }
      if (a.hit && !a.research) { learner.step(text, a.hit, 1); }
      paintStatus();
    }

    /* The reasoning layer gets first refusal on every question. It only
       claims one when it can *derive* the answer (and then it has already run
       the program) or when the question is about something the concept library
       actually holds. Everything else -- including anything current, external
       or about CELL4 itself -- falls through to the retrieval and web path
       below, unchanged. */
    function tryReason(next) {
      /* ARC-AGI is its own route and takes precedence, including over the
         CELL4 branch below: a question about the score is answered by
         measuring it here rather than by retrieving a sentence that claims it.
         C4ARC never invents a number -- it runs the solver against tasks whose
         answers it does not read until after it has committed to one. */
      if (typeof C4ARC !== "undefined" && C4ARC.ready() && C4ARC.isRequest(text)) {
        C4ARC.answer(text).then(function (ar) {
          if (!ar) return next();
          land({
            text: ar.text,
            sources: [],
            used: ar.used || ["local ARC engine"],
            entity: "arc-agi",
            act: ar.ok ? "measured" : "arc-insufficient",
            insufficientEvidence: !ar.ok,
            skipDialogue: true
          });
        }, function () {
          land({ text: "The ARC engine did not finish that run.", sources: [],
                 insufficientEvidence: true });
        });
        return true;
      }
      if (typeof C4Reason === "undefined" || /cell4/i.test(text)) {
        return next();
      }
      var decision;
      try {
        decision = C4Reason.plan(text);
      } catch (e) { return next(); }
      /* Software construction is a separate semantic route. A build request
         that falls outside the fixed algorithm library must not degrade into
         extractive documentation search: docs can justify an API choice, but
         they are not the requested program. C4SWE parses requirements, scores
         candidate plans and validates emitted code. Known C4Reason algorithms
         still keep their existing code route. */
      var sweFollowup = typeof C4SWE !== "undefined" && sweContext && C4SWE.isFollowup(text, sweContext);
      var sweStandalone = typeof C4SWE !== "undefined" && C4SWE.isRequest(text);
      var sweRequest = !!(sweStandalone || sweFollowup);
      /* Code dialogue has its own state. A fresh construction request replaces
         the previous program context; only an actual edit/follow-up inherits
         it. A non-SWE turn clears stale code context so a later "make it..."
         cannot unexpectedly edit a program from several topics ago. */
      var swePrior = sweFollowup ? sweContext : null;
      if (!sweFollowup) sweContext = null;
      var swePlan = null;
      if (sweRequest) {
        try { swePlan = C4SWE.plan(text, swePrior); } catch (e) { swePlan = null; }
      }
      /* If the general SWE planner can satisfy every requested capability, it
         outranks fuzzy concept-library matches. This prevents words such as
         "random" or "async" from accidentally selecting an unrelated fixed
         algorithm entry. When the SWE planner cannot cover the request, a real
         exact algorithm already handled by C4Reason is still allowed through. */
      if (sweRequest && ((swePlan && swePlan.route === "swe") || !decision || decision.route === "web" || decision.route === "code-unknown")) {
        C4SWE.answer(text, swePrior).then(function (sr) {
          if (!sr) return next();
          /* Fail closed for unsupported/invalid construction requests. Falling
             through here recreates the original bug: an unrelated docs passage
             would become the "answer" merely because it shares vocabulary. */
          if (sr.ok && sr.spec) sweContext = sr.spec;
          land({
            text: sr.text || "I could not derive a complete implementation for that request.",
            sources: sr.sources || [],
            used: (sr.sources && sr.sources.length) ? (sr.used || []) : [],
            reasoned: sr,
            entity: sr.planId || "software",
            act: sr.ok ? "constructed" : "construction-insufficient",
            insufficientEvidence: !sr.ok,
            skipDialogue: true
          });
        }, function () {
          land({text:"I could not complete the software-construction plan safely.",sources:[],insufficientEvidence:true});
        });
        return true;
      }
      if (!decision || decision.route === "web") return next();
      /* A software noun such as "binary search" is not an instruction to
         search the internet. Preserve the globe override and explicit lookup
         wording, but do not let the broad WEB_ASKED token regex steal code
         requests from the compiler. */
      var explicitWebForSWE = /\b(?:search\s+(?:the\s+)?(?:web|internet|online)|look\s*up|google|browse\s+(?:the\s+)?web|wikipedia|wikidata|duckduckgo|ddg)\b/i.test(text);
      if (decision.route !== "compute" && (webAlways || (!sweRequest && WEB_ASKED.test(text)) || (sweRequest && explicitWebForSWE))) return next();
      /* Factual explanations are evidence questions, not reference-library
         completions. Route them through the bundled dataset/Wiki research path
         so the answer planner can verify identity and choose source-backed
         propositions. Compute/code routes remain unchanged. */
      if (decision.route === "explain") return next();
      C4Reason.answer(text).then(function (r) {
        if (!r) return next();
        if (!r.ok && r.route !== "compute" && r.route !== "code-unknown") return next();
        if (r.route === "code-unknown") return next();
        if (r.route === "code") sweContext = null;
        land({
          text: r.text,
          sources: [],
          used: [r.route === "compute"
            ? "computed \u00b7 " + (r.languageName || r.language || "lua")
            : "reference library"],
          reasoned: r,
          entity: r.concept || "",
          act: "derived",
          skipDialogue: r.route === "code"
        });
      }, function () {
        if(decision.route === "compute") return land({text:"I could not complete this calculation. Check the expression and try again.",sources:[]});
        next();
      });
      return true;
    }

    setTimeout(function () { tryReason(resolveLocally); }, 240 + Math.random() * 200);

    function resolveLocally() {
      var local, forced, asked, localCoverage, localDrift;
      try {
        // Check the original prompt before dialogue rewriting or web overrides.
        if (/cell4/i.test(text)) return land(answer(text, true));
        // Basic site questions also work without spelling out the brand.
        local = basicSiteAnswer(text);
        if (local) return land(local);
        local = answer(effective);
        forced = webAlways || WEB_ASKED.test(text);
        asked = tok(effective);
        localCoverage = local.hit ? brain.coverage(local.hit.i, asked) : 0;
        localDrift = local.hit ? topicDrift(analyzeQuestion(effective), local.hit.p) : 1;
      } catch (e) {
        return land({ text: casualFallback(text), sources: [], conversational: true });
      }
      /* A multi-term question that only shares one loose word with CELL4 is not
         a real local answer; let the research fallback resolve the missing
         context instead of stopping early. Topic drift is the same gate the
         research layer uses, so the site cannot speak over an unrelated fact. */
      if (local.hit && !forced && (asked.length < 2 || localCoverage >= 0.66) &&
          localDrift < 0.7 && localSenseAcceptable(effective, local.hit.p))
        return land(local);

      /* Routing. The fitted family head chooses -- but only among the families
         the grammar admits, and only when the hard guard permits a social turn
         at all. With no artifact loaded this is exactly the heuristic that
         shipped before. */
      var routed = false;
      try {
        if (!forced && conversationalAllowedHard(text)) {
          if (textModel && textModel.family_weights) {
            var fd = familyDist(text, snap, siteLexicon()), bestF = "", bestP = -1;
            for (var fk in fd) if (fd[fk] > bestP) { bestP = fd[fk]; bestF = fk; }
            routed = bestF === "conversational";
          } else {
            routed = looksConversational(text);
          }
        }
      } catch (e) { routed = !forced && looksConversational(text); }
      if (routed) return land(conversationalReply(text, snap));

      if (!fed) return land(local);
      fed.ask(effective, function (rows) {
        try {
          if (rows && rows.length) {
            var researched = researchAnswer(effective, rows, resolved);
            if (researched && researched.text && !researched.clarification) {
              absorb(rows, effective, researched);
              return land(researched);
            }
          }
        } catch (e) {}

        /* A short fragment can be either a new topic or an elliptical follow-up.
           Try the new-topic reading first. Only if it fails do we borrow the
           previous verified subject. This avoids hard-coding words like
           "applications" while still making terse follow-ups work. */
        var contextQ = contextualFallbackQuery(text, snap);
        if (contextQ && normalizeAnswer(contextQ) !== normalizeAnswer(effective)) {
          var contextResolved = { subject: snap.subject, entity: snap.entity || "", carried: true,
                                  action: "carry", continuation: true, elliptical: true,
                                  noveltyOnly: genericContinuationOnly(text),
                                  evidenceSeen: (snap.evidenceSeen || []).slice() };
          return fed.ask(contextQ, function (rows2) {
            try {
              if (rows2 && rows2.length) {
                var researched2 = researchAnswer(contextQ, rows2, contextResolved);
                if (researched2 && researched2.text && !researched2.clarification) {
                  resolved = contextResolved; effective = contextQ;
                  absorb(rows2, contextQ, researched2);
                  return land(researched2);
                }
              }
            } catch (e2) {}
            resolved = contextResolved; effective = contextQ;
            land({text: "I couldn’t find enough relevant evidence to answer “" + text + "”. Try a more specific topic, error message, or source name.", sources:[], used:[], insufficientEvidence:true});
          });
        }
        land({text: "I couldn’t find enough relevant evidence to answer “" + text + "”. Try a more specific topic, error message, or source name.", sources:[], used:[], insufficientEvidence:true});
      });
    }
  }

  /* External research is intentionally not added to brain.passages. See the
     isolated absorb() research memory above. */

  function paintStatus() {
    var s = learner.summary();
    statusEl.innerHTML = "";
    statusEl.appendChild(el("span", null,
      brain.passages.length + " site passages"));
    if(evidenceIndex && window.C4_SWE_DATA) statusEl.appendChild(el("span", null,
      " · " + window.C4_SWE_DATA.passages.length + " saved documentation passages"));
    statusEl.appendChild(el("span", "sep", "·"));
    statusEl.appendChild(el("span", null,
      (brain.lm ? brain.lm.vocab.length : 0) + "-word model"));
    statusEl.appendChild(el("span", "sep", "·"));
    var learn = el("span", null, "learned " + s.adopted + "/" + s.rounds);
    learn.title = "Gradient steps this browser kept, out of steps it tried. A step is " +
                  "discarded when it would rank earlier questions worse.";
    statusEl.appendChild(learn);
    statusEl.appendChild(el("span", "sep", "·"));
    var live = 0;
    if (fed) fed.defs.forEach(function (d) { if (fed.state(d.id) !== "disabled") live++; });
    var srcs = el("a", null, live + " databases");
    srcs.title = "Keyless public APIs this page can query. Click to check which " +
                 "actually answer from this browser.";
    srcs.addEventListener("click", checkSources);
    statusEl.appendChild(srcs);
    statusEl.appendChild(el("span", "sep", "·"));
    var bridge = el("span", null, textModel ?
      ("ASTRON text " + Object.keys(textModel.family_weights || {}).length + " feats") :
      "ASTRON text off");
    bridge.title = "policy/text_gabriel_lm.json, fitted offline by astron/xyz/text/train.py " +
                   "and loaded same-origin. State: " + textModelState +
                   ". Without it the page falls back to its deterministic ranking.";
    statusEl.appendChild(bridge);
    if (convPack || convo) {
      statusEl.appendChild(el("span", "sep", "·"));
      var chatLabel = convPack ? ((convPack.acts || []).length + " dialogue acts") :
        (convo && convo.ready ? (convo.pairs.length + " chat pairs") :
         (convo && convo.loading ? "chat loading" : "chat fallback"));
      var chat = el("span", null, chatLabel);
      chat.title = convPack ?
        ("data/conversation_pack.json: a fitted dialogue-act model plus response " +
         "plans authored in astron/xyz/text/conversation.py. No dataset text is " +
         "shipped or emitted. State: " + convPackState + ".") :
        "General conversation corpus: cached local retrieval with a keyless public-source fallback.";
      statusEl.appendChild(chat);
    }
    if (s.rounds) {
      statusEl.appendChild(el("span", "sep", "·"));
      var ex = el("a", null, "export");
      ex.title = "Download what this browser learned, to fold back into the trained model";
      ex.addEventListener("click", exportLearning);
      statusEl.appendChild(ex);
    }
  }

  function checkSources() {
    var m = el("div", "msg bot", "Checking every source from this browser…");
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    fed.diagnose(function (rows, text) {
      var ok = rows.filter(function (r) { return r[1].indexOf("result") > 0; }).length;
      m.textContent = ok + " of " + rows.length + " public databases answered from " +
        "this browser just now:\n\n" + text +
        "\n\nA source that says \"blocked or down\" is refusing this page's " +
        "origin or is unreachable on this network. It is switched off here for a " +
        "day and the rest carry on.";
      paintStatus();
      log.scrollTop = log.scrollHeight;
    });
  }

  function exportLearning() {
    var blob = new Blob([JSON.stringify(
      { deltas: brain.deltas, history: learner.hist, events: learner.events,
        research: researchMemory, researchWeights: reasoner ? reasoner.w : null }, null, 1)],
      { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "robots-learned.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function boot() {
    if (window.top !== window.self) document.body.classList.add("embed");
    brain.reindex();
    /* Give every passage a stable identity: the learner's gate compares the
       passages it ranked before against the ones it ranks now, and live files
       change the indices under it. */
    brain.passages.forEach(function (p, i) { p.key = (p.s || "") + "#" + i; });
    learner = new Learner(brain);
    reasoner = new ResearchReasoner();
    fed = new Federation(window.ROBOTS_SOURCE_DEFS || []);
    if (evidenceIndex) {
      if(window.C4_SWE_DATA) evidenceIndex.add("swe-docs",window.C4_SWE_DATA.passages);
      evidenceIndex.add("cell4",brain.passages.map(function(r){return Object.assign({},r,{scope:"site"});}));
    }
    dialogue = new DialogueState();
    convo = new ConversationCorpus();
    /* The ChatterBot corpus is the FALLBACK now, so it is no longer fetched on
       every page load. It is loaded only if the conversation pack failed to
       arrive, or the first time a social turn actually needs it -- two network
       requests saved on every visit that never chats. */

    /* The ASTRON artifacts. Both are optional: nothing below waits on them,
       nothing above throws without them, and the page is fully usable while
       they are in flight or if they never arrive. */
    loadArtifact(TEXT_MODEL_URL, TEXT_MODEL_KEY, function (doc, how) {
      if (doc && doc.kind === "astron-text-lm") {
        textModel = doc;
        tsStop = null;                       /* rebuild against the shipped list */
      }
      textModelState = doc ? how : ("unavailable:" + how);
      paintStatus();
    });
    loadArtifact(CONV_PACK_URL, CONV_PACK_KEY, function (doc, how) {
      if (doc && doc.kind === "astron-conversation-pack") convPack = doc;
      convPackState = doc ? how : ("unavailable:" + how);
      if (!convPack && convo) convo.load();      /* fall back to the old corpus */
      paintStatus();
    });

    var suggestions = CFG.suggestions ||
      ["What does CELL4 do?", "What is robots.js?", "Show me the proof of work",
       "How do I get in touch?"];
    suggestions.forEach(function (s) {
      var b2 = el("button", null, s);
      b2.addEventListener("click", function () { ask(s); });
      chips.appendChild(b2);
    });

    bot({ text: CFG.greeting ||
      "Ask me anything about CELL4. I answer out of this site's own pages, I run entirely in your browser, and I get better at this as people ask me things.",
      sources: [] });
    paintStatus();
    sub.textContent = "reads this site · runs in your browser";

    readLive(function (extra, note) {
      if (extra && extra.length) {
        extra.forEach(function (p, i) { p.key = (p.s || "") + "@" + i; });
        brain.passages = brain.passages.concat(extra);
        brain.reindex();
        brain.passages.forEach(function (p, i) {
          if (!p.key) p.key = (p.s || "") + "#" + i;
        });
        sub.textContent = "read " + note + " from " + SOURCES.join(", ");
      } else {
        sub.textContent = "reads this site · runs in your browser" +
          (note === "local file" ? " · offline copy" : "");
      }
      paintStatus();
    });
  }

  /* wiring */
  $("#launcher").addEventListener("click", function () { panel.classList.toggle("open"); input.focus(); });
  $(".close").addEventListener("click", function () { panel.classList.remove("open"); });
  $(".theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : (cur === "light" ? "dark" :
      (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
    document.documentElement.setAttribute("data-theme", next);
  });
  $(".ask").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    input.value = "";
    ask(v);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") panel.classList.remove("open");
  });

  $(".web").addEventListener("click", function () {
    webAlways = !webAlways;
    this.classList.toggle("on", webAlways);
    this.title = webAlways ? "Public databases: always" : "Also search public databases";
  });

  /* In-page regression assertions. These are the cases the previous build
     fixed; they run without a network and fail loudly rather than silently
     regressing. `node tools/browser_test.js` runs the same list headlessly. */
  /* The reasoning layer ships with its own Node test suites; this is the
     in-page smoke check that the modules loaded and still agree with them. */
  function reasonSelfTest(check) {
    var loaded = typeof C4Reason !== "undefined" && typeof C4Lua !== "undefined" &&
                 typeof C4Lang !== "undefined" && typeof C4Knowledge !== "undefined";
    check("reason modules loaded", loaded);
    if (!loaded) return;
    check("lua interpreter runs", C4Lua.run("io.write(1+1)").output === "2");
    check("lua stdlib present",
          C4Lua.run("io.write(type(os.time()))").output === "number");
    check("clock question is computed, not searched",
          C4Reason.plan("what is the time?").route === "compute");
    check("live facts still go to the web",
          C4Reason.plan("what is the current bitcoin price").route === "web");
    check("concept questions are explained",
          C4Reason.plan("what is a markov chain").route === "explain");
    check("language targets resolve", C4Lang.list().length >= 12);
    check("knowledge base loaded", C4Knowledge.all().length >= 30);
    var quick = C4Knowledge.emit("quicksort", "lua");
    check("emitted lua runs",
          quick.ok && C4Lua.run(quick.code).output === "1,2,3,4,6,7,8,9\n",
          quick.ok ? JSON.stringify(C4Lua.run(quick.code).output) : quick.error);
    /* The JavaScript runtime here is a Worker, which the Node suites cannot
       exercise -- they use `vm`. So the browser has to check its own path, or
       a Worker-only fault ships unnoticed. One already did: naming a sandbox
       parameter `eval` is a SyntaxError under "use strict", and every Node
       test passed regardless. */
    check("javascript sandbox reachable",
          sandboxCheck.indexOf("failed") !== 0, sandboxCheck);
    C4Exec.run("javascript", "console.log(6 * 7)").then(function (r) {
      sandboxCheck = (r.ran && r.ok && r.output.indexOf("42") >= 0)
        ? "ok" : "failed: " + (r.error || JSON.stringify(r.output));
      if (sandboxCheck !== "ok") console.warn("[c4] " + sandboxCheck);
    }, function (e) { sandboxCheck = "failed: " + e; });
  }

  /* Set asynchronously by the check above: "pending" until the first Worker
     round-trip completes, then the standing verdict. */
  var sandboxCheck = "pending";

  function selfTest() {
    var out = [], ok = 0;
    function check(name, cond, detail) {
      out.push({ name: name, pass: !!cond, detail: detail || "" });
      if (cond) ok++;
    }
    check("identity keeps multiplicity",
      identityKey("high school") !== identityKey("High School High"),
      identityKey("high school") + " vs " + identityKey("High School High"));
    check("duplicate-token mismatch detected",
      duplicateMismatch("high school", "High School High") === true);
    check("identity keeps stop words",
      identityKey("matrix") !== identityKey("the matrix"));
    check("expanded compound is tier EXPANDED",
      senseTier("high school", { title: "High School High" }).tier === TIER_EXPANDED);
    check("exact phrase outranks expansion",
      senseTier("high school musical", { title: "High School Musical" }).tier === TIER_EXACT_PHRASE);
    check("verified redirect is top tier",
      senseTier("high school", { title: "Secondary school", verifiedTitle: true,
                                 alias: "high school" }).tier === TIER_VERIFIED_TITLE);
    check("math is not a subsequence of MathJax",
      senseTier("math", { title: "MathJax" }).tier === TIER_FUZZY);
    check("math rock resolves exactly",
      senseTier("math rock", { title: "Math rock" }).tier === TIER_EXACT_PHRASE);
    check("concept-of phrase is not forced into relation grammar",
      tsSplit("what is law of large numbers").relation === "" &&
      tsSplit("what is law of large numbers").subject === "law of large numbers");
    check("multiword relation head stays relational",
      tsSplit("what is prime minister of Canada").relation === "prime minister" &&
      tsSplit("what is prime minister of Canada").subject === "Canada");
    check("continuation rewrite preserves a requested facet",
      rewriteWithSubject("more on applications", "Quantum entanglement") === "Quantum entanglement applications");
    check("pronoun modifier rewrite does not invent a compound identity",
      rewriteWithSubject("what is it used for?", "Quantum entanglement") === "Quantum entanglement used for");
    check("qualified title is the same concept",
      senseTier("python", { title: "Python (programming language)" }).tier === TIER_EXACT_PHRASE);
    var pr = pruneByTier("high school", [
      { title: "High School High" }, { title: "High School Musical" },
      { title: "Secondary school", verifiedTitle: true, alias: "high school" }], true);
    check("ladder drops expansions when a verified sense exists",
      pr.kept.length === 1 && pr.kept[0].title === "Secondary school",
      pr.kept.map(function (c) { return c.title; }).join(", "));
    check("greeting routes conversationally",
      grammaticalFamilies("hey", [], null).indexOf("conversational") >= 0);
    check("a what-is question cannot route conversationally",
      grammaticalFamilies("what is photosynthesis", [], null).indexOf("conversational") < 0);
    check("hard guard refuses a social answer to a research form",
      conversationalAllowedHard("what is photosynthesis") === false);
    check("topic shift is detected",
      tsSignatures("anyway what is photosynthesis", null, null).indexOf("shift:yes") >= 0);
    check("shift strips the preamble from the subject",
      tsSplit("anyway what is photosynthesis").subject === "photosynthesis",
      tsSplit("anyway what is photosynthesis").subject);
    var d = new DialogueState();
    d.commit("tell me about Einstein", { action: "set", subject: "Einstein" },
             { entity: "Albert Einstein", confidence: 0.9 });
    check("anaphora carries the subject",
      d.resolve("when was he born").subject === "Einstein",
      d.resolve("when was he born").subject);
    check("explicit shift clears the subject",
      d.plan("anyway what's photosynthesis").action === "reset",
      d.plan("anyway what's photosynthesis").action);
    check("empty input never throws",
      (function () { try { tsSignatures("", null, null); resolveSenses("", [], null); return true; }
                     catch (e) { return false; } })());
    reasonSelfTest(check);
    check("no dangling connective in the fallback",
      !/\b(?:and|the|because|of|to)\s*(?:…|\.\.\.)?$/i.test(casualFallback("hi")));
    return { passed: ok, total: out.length, results: out };
  }

  window.robots = {
    ask: ask, brain: brain,
    evidence: function () { return evidenceIndex; },
    addDataset: function (name, rows) {
      if(!evidenceIndex) return 0;
      var added=evidenceIndex.add(name,rows);
      if(fed) fed.cache={};
      return added;
    },
    searchAnswer: function (question, rows) { return researchAnswer(question,rows); },
    export: exportLearning, selfTest: selfTest,
    last: function () { return lastAnswer; },
    textModel: function () { return textModel; },
    conversationPack: function () { return convPack; },
    dialogue: function () { return dialogue; },
    bridge: {
      signatures: tsSignatures, form: tsQueryForm, split: tsSplit,
      identityKey: identityKey, identityTokens: identityTokens,
      duplicateMismatch: duplicateMismatch, orderedContainment: orderedContainment,
      tier: senseTier, prune: pruneByTier, families: grammaticalFamilies,
      familyDist: familyDist, candidateSignature: candidateSignature,
      candidateScore: candidateScore, act: convAct, render: convRender,
      resolve: resolveSenses, propositions: extractPropositions,
      plan: buildAnswerPlan, synthesize: synthesizeFromPlan,
      allowChat: conversationalAllowedHard, rewriteWithSubject: rewriteWithSubject,
      DialogueState: DialogueState
    },
    open: function () { panel.classList.add("open"); },
    sources: function () { return fed; },
    reasoner: function () { return reasoner; },
    /* The reasoning layer, exposed so a host page can inspect a routing
       decision, list the code-generation targets, or add one of its own --
       including a language it transpiles itself, which also makes that
       language runnable here. See C4-REASONING.md. */
    reason: function () {
      return typeof C4Reason === "undefined" ? null : C4Reason;
    },
    plan: function (question) {
      return typeof C4Reason === "undefined" ? null : C4Reason.plan(question);
    },
    languages: function () {
      return typeof C4Lang === "undefined" ? [] : C4Lang.list();
    },
    registerLanguage: function (spec) {
      if (typeof C4Reason === "undefined") {
        throw new Error("the reasoning layer is not loaded");
      }
      return C4Reason.registerLanguage(spec);
    },
    run: function (language, source) {
      if (typeof C4Exec === "undefined") {
        return Promise.reject(new Error("the execution layer is not loaded"));
      }
      return C4Exec.run(language, source);
    },
    conversation: function () { return convo; },
    researchMemory: function () { return researchMemory.slice(); },
    diagnose: function (cb) { return fed.diagnose(cb); },
    web: function (on) { webAlways = on !== false; $(".web").classList.toggle("on", webAlways); }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script src="c4-semantic-search-fix-v5.js"></script>
</body>
