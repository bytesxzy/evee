          if (prev && DETERMINER.test(prev)) return m;
          return (prev || "") + (gap || "") + verb;
        });
    }
    /* created <-> developed applied as two sequential rules mapped both words
       onto "created". One simultaneous swap keeps the paraphrase honest. */
    return out.replace(/\b(created|developed)\b/gi, function (m) {
      var lower = m.toLowerCase() === "created" ? "developed" : "created";
      return m.charAt(0) === m.charAt(0).toUpperCase() ?
        lower.charAt(0).toUpperCase() + lower.slice(1) : lower;
    });
  }

  function wikiWordTokens(s) {
    return String(s || "").toLowerCase().match(/[a-z0-9]+(?:'[a-z0-9]+)?/g) || [];
  }

  function longestSharedTokenRun(a, b) {
    var x = wikiWordTokens(a), y = wikiWordTokens(b), best = 0;
    if (!x.length || !y.length) return 0;
    var prev = new Array(y.length + 1).fill(0);
    for (var i = 1; i <= x.length; i++) {
      var cur = new Array(y.length + 1).fill(0);
      for (var j = 1; j <= y.length; j++) {
        if (x[i - 1] === y[j - 1]) { cur[j] = prev[j - 1] + 1; if (cur[j] > best) best = cur[j]; }
      }
      prev = cur;
    }
    return best;
  }

  function rewriteWikiClause(text) {
    var out = txtOf(text || "");
    for (var i = 0; i < WIKI_PHRASE_REWRITES.length; i++) out = out.replace(WIKI_PHRASE_REWRITES[i][0], WIKI_PHRASE_REWRITES[i][1]);
    out = guardedVerbRewrites(out);
    out = out.replace(/\bwhich is used for\b/gi, "and it is used for")
             .replace(/\bwhich are used for\b/gi, "and they are used for")
             .replace(/\bthat is used for\b/gi, "and it is used for")
             .replace(/\bthat are used for\b/gi, "and they are used for")
             .replace(/\s+([,.;:!?])/g, "$1").replace(/\s+/g, " ").trim();
    return out;
  }

  function paraphraseWikiSentence(source, title, analysis, index) {
    var src = txtOf(source || "");
    if (!src) return "";
    var out = rewriteWikiClause(src);
    var escTitle = escRe(title).replace(/\\ /g, "\\s+");
    try {
      var cop = new RegExp("^" + escTitle + "\\s+(is|are|was|were)\\s+(.+)$", "i");
      var m = out.match(cop);
      if (m && m[2]) {
        var pred = m[2].replace(/[.]+$/, "");
        if (/^(?:a|an|the)\s+/i.test(pred))
          out = title + " can be described as " + pred + ".";
        else
          out = "In simple terms, " + title + " " + (m[1].toLowerCase() === "are" ? "are" : "is") + " " + pred + ".";
      }
    } catch (e) {}
    if (index > 0 && !new RegExp("^" + escRe(title) + "\\b", "i").test(out)) {
      out = out.replace(/^It\s+/i, title + " ").replace(/^They\s+/i, title + " ");
      if (!/^(?:Another|A further|One|In addition|The)\b/i.test(out)) out = "Another relevant point is that " + out.charAt(0).toLowerCase() + out.slice(1);
    }
    out = rewriteWikiClause(out);

    /* If a long verbatim run survived the structural rewrite, break it with a
       second conservative lexical pass. The threshold is intentionally low
       enough to stop sentence copying but high enough to preserve names and
       technical terms that cannot honestly be paraphrased. */
    if (longestSharedTokenRun(out, src) > 11) {
      out = out.replace(/\bthe study of\b/gi, "the examination of")
               .replace(/\bthe use of\b/gi, "using")
               .replace(/\bthe development of\b/gi, "developing")
               .replace(/\bthe ability to\b/gi, "the capacity to")
               .replace(/\ba set of\b/gi, "a collection of")
               .replace(/\ba group of\b/gi, "a collection of")
               .replace(/\brelated to\b/gi, "connected with")
               .replace(/\bbased on\b/gi, "built around")
               .replace(/\bin order to\b/gi, "to")
               .replace(/\bfor example\b/gi, "for instance")
               .replace(/\bsuch as\b/gi, "including");
    }
    return completeResearchText(out, 420);
  }

  function synthesizeWikipedia(row, analysis, maxSentences) {
    if (!row) return "";
    var ev = (row.wikiEvidence && row.wikiEvidence.length ? row.wikiEvidence : sentences(row.t || ""));
    var title = cleanPhrase((row.wikiExact && row.wikiAlias) ? row.wikiAlias :
                            (row.h || analysis.lookup || analysis.subject || "This topic"));
    var out = [], used = Object.create(null), limit = Math.max(1, Math.min(maxSentences || 3, 3));
    for (var i = 0; i < ev.length && out.length < limit; i++) {
      var src = txtOf(ev[i]);
      if (!src) continue;
      var para = paraphraseWikiSentence(src, title, analysis, out.length);
      if (!para) continue;

      /* When an exact Wikipedia alias redirects to a differently named article,
         answer in the user's recognized term rather than silently switching
         labels. This is structural: replace the source noun phrase before its
         copula, whatever the topic is. Examples include `Math -> Mathematics`,
         `AI -> Artificial intelligence`, and `High school -> Secondary school`. */
      if (!out.length && row.wikiExact && row.wikiAlias) {
        var aliasRe = new RegExp("^" + escRe(title).replace(/\\ /g, "\\s+") + "\\b", "i");
        if (!aliasRe.test(para)) {
          var lead = para.match(/^.{1,150}?\s+(is|are|was|were)\s+(.+)$/i);
          if (lead && lead[2]) para = title + " " + lead[1].toLowerCase() + " " + lead[2];
        }
      }
      var key = normalizeAnswer(para);
      if (used[key]) continue;
      used[key] = 1; out.push(para);
    }
    var text = completeResearchText(out.join(" "), 760);
    /* Final guard: never return an evidence sentence byte-for-byte as the whole
       answer even if a rewrite rule failed unexpectedly. */
    for (i = 0; i < ev.length; i++) {
      if (normalizeAnswer(text) === normalizeAnswer(ev[i])) {
        text = title + " — " + paraphraseWikiSentence(ev[i], title, analysis, 0);
        break;
      }
    }
    return text;
  }

  /* Every path that puts source prose in front of a user goes through here.
     The plan-based synthesiser covers the read-article case; these are the
     other three -- a search snippet with no full text, a multi-source summary,
     and the relational fallback -- and they were emitting source sentences
     unchanged, which is how the copy rate stayed high even after the main
     synthesiser stopped doing it. */
  function restateEvidence(sentence, title, row) {
    var src = txtOf(sentence || "");
    if (!src) return "";
    var ev = (row && row.wikiEvidence && row.wikiEvidence.length) ?
      row.wikiEvidence : sentences(txtOf((row && row.t) || src));
    var out = renderClause(rewriteWikiClause(src), ev, 13);
    if (out && isVerbatimSentence(out, ev)) {
      var mod = splitModifier(out.replace(/[.]+$/, ""));
      if (mod) {
        var pron = /s$/i.test(title || "") && !/ss$/i.test(title || "") ? "They are" : "It is";
        out = mod.head.charAt(0).toUpperCase() + mod.head.slice(1) + ". " + pron + " " +
              mod.modifier.charAt(0).toLowerCase() + mod.modifier.slice(1).replace(/[.;]+$/, "") + ".";
      } else {
        var fronted = frontPrepositional(out.replace(/[.]+$/, ""));
        if (fronted) out = fronted;
      }
    }
    return out || completeResearchText(src, 520);
  }

  function researchAnswer(question, rows, state) {
    if (!rows || !rows.length) return null;
    var analysis = analyzeQuestion(question), ranked = reasoner ? reasoner.rank(question, rows) : rows;
    if (!ranked.length) return null;

    /* ASTRON text bridge. The identity ladder runs above the lexical reranker
       and below nothing: it decides which candidates may be answered at all,
       then the fitted candidate head orders the survivors within their tier.
       Every failure mode here -- no artifact, a throw, an empty result -- falls
       through to exactly the ranking that shipped before the bridge existed. */
    var resolution = null;
    try { resolution = resolveSenses(question, ranked, state); } catch (e) { resolution = null; }
    if (resolution && resolution.candidates.length) {
      var reordered = [], ri;
      for (ri = 0; ri < resolution.candidates.length; ri++)
        reordered.push(resolution.candidates[ri].row);
      ranked = reordered;
    } else if (resolution && resolution.focused && resolution.asked) {
      /* Every candidate failed verification. Say so; do not answer with one. */
      return {
        text: "I could not confirm a page that is actually about " + "“" +
              cleanPhrase(resolution.asked) + "”" + " " + "—" + " what I found matched the " +
              "words but not the concept. Can you give me one more word of context?",
        sources: [], used: [], clarification: true,
        research: { features: null, row: null }, researchRows: ranked
      };
    }

    var top = ranked[0], chosen = [top], text = "";

    if (analysis.direct) {
      if ((top._drift || topicDrift(analysis, top)) >= 0.86 && !top.structured) {
        for (var di = 1; di < ranked.length; di++) {
          if ((ranked[di]._drift || topicDrift(analysis, ranked[di])) < 0.7) {
            top = ranked[di]; chosen[0] = top; break;
          }
        }
      }
      var ans = top.answer || extractRelationAnswer(analysis, top);
      if (!ans) {
        for (var i = 1; i < ranked.length; i++) {
          ans = ranked[i].answer || extractRelationAnswer(analysis, ranked[i]);
          if (ans) { top = ranked[i]; chosen[0] = top; break; }
        }
      }
      if (ans) {
        var displaySubject = (top.subject && phraseCoverage(analysis.subject, top.subject) >= 0.75) ? top.subject :
          ((top.h && top.h.split(/\s+/).length <= analysis.subject.split(/\s+/).length + 3 &&
            phraseCoverage(analysis.subject, top.h) >= 0.75) ? top.h : analysis.subject);
        var displayRelation = top.relation || analysis.relation;
        if (/\b(?:of|for|in)\s+the\s+/i.test(analysis.raw) && !/^the\s+/i.test(displaySubject)) displaySubject = "the " + displaySubject;
        if (analysis.form === "relation" || analysis.form === "possessive")
          text = "The " + displayRelation + " of " + displaySubject + " is " + trimAnswerValue(ans) + ".";
        else
          text = displaySubject + " — " + displayRelation + ": " + trimAnswerValue(ans) + ".";
        for (var j = 0; j < ranked.length && chosen.length < 3; j++) {
          var jf = ranked[j]._researchFeatures || {};
          if (ranked[j] !== top && String(ranked[j].o || ranked[j].d) !== String(top.o || top.d) &&
              !jf.intentMismatch && (jf.senseCollision || 0) < 0.5 && sameEvidenceAnswer(top, ranked[j])) chosen.push(ranked[j]);
        }
      }
    }

    if (!text) {
      if (analysis.focused) {
        /* A definition / identity lookup is one semantic target. Multiple
           databases may corroborate it, but their prose should not be glued
           together into a synthetic paragraph. Answer with the best complete
           sentence and use the others only as supporting sources. */
        if (ambiguityRow(top)) {
          var altSense = null;
          for (var ak = 1; ak < ranked.length; ak++) if (!ambiguityRow(ranked[ak])) { altSense = ranked[ak]; break; }
          var ambTerm = cleanPhrase(analysis.lookup);
          text = ambTerm.charAt(0).toUpperCase() + ambTerm.slice(1) +
                 " is ambiguous and can refer to multiple things.";
          if (altSense && altSense.h) {
            /* A title is a name: "The Matrix" is not "Matrix". Stripping the
               article for display renamed the very sense being offered. */
            text += " One strong match is " + txtOf(altSense.h) + ".";
            chosen.push(altSense);
          }
        } else {
          /* article -> evidence windows -> propositions -> plan -> sentence.
             The plan decides what a definition must establish first, so an
             answer to "what is X" leads with what X *is* rather than with the
             first well-scoring sentence in the article. */
          var planned = "";
          if (top.wikiRead && top.wikiEvidence && top.wikiEvidence.length) {
            try {
              var pfam = (resolution && resolution.family === "identity") ? "identity" :
                         (analysis.lookupForm === "identity" ? "identity" : "definition");
              var ptitle = cleanPhrase((top.wikiExact && top.wikiAlias) ? top.wikiAlias : (top.h || analysis.lookup));
              var props = extractPropositions(top.wikiEvidence, ptitle || top.h, analysis,
                                              [top.h, top.wikiTargetTitle, top.wikiAlias]);
              var plan = buildAnswerPlan(pfam, props, analysis, ptitle || top.h,
                                         { skipLead: !!(state && state.continuation) });
              planned = synthesizeFromPlan(plan, analysis, top.wikiEvidence);
            } catch (e) { planned = ""; }
          }
          text = planned ||
                 (top.wikiRead ? synthesizeWikipedia(top, analysis, analysis.definition ? 3 : 2) :
                                 restateEvidence(bestResearchSentence(top, analysis),
                                                 cleanPhrase(top.h || analysis.lookup), top));
          /* If the winning sense adds a qualifier the user did not supply, say
             which sense won instead of silently pretending the bare term was
             unambiguous. */
          var undisclosed = resolution && resolution.family === "sense_undisclosed";
          if (undisclosed && top.h)
            text = cleanPhrase(top.h) + " — " + text +
                   " (I read " + "“" + cleanPhrase(resolution.asked) + "”" +
                   " as that sense; say the word if you meant another.)";
          else if (lookupExpansionPenalty(analysis, top) >= 0.8 && lookupCanonicalScore(analysis, top) < 1 && top.h)
            text = cleanPhrase(top.h) + " — " + text;
        }
        for (var fk = 1; fk < ranked.length && chosen.length < 3; fk++) {
          var fr = ranked[fk];
          if (String(fr.o || fr.d) === String(top.o || top.d)) continue;
          var support = independentAgreement(top, fr, analysis.tokens);
          if (support >= 0.48 || answerAgreement(bestResearchSentence(top, analysis), bestResearchSentence(fr, analysis)) >= 0.45)
            chosen.push(fr);
        }
      } else {
        var parts = [], origins = Object.create(null);
        for (var k = 0; k < ranked.length && parts.length < 3; k++) {
          var r = ranked[k], origin = String(r.o || r.d || r.x || k).toLowerCase();
          if (origins[origin]) continue;
          var sentence = r.wikiRead ? synthesizeWikipedia(r, analysis, 1) :
            restateEvidence(bestResearchSentence(r, analysis), cleanPhrase(r.h || ""), r);
          if (!sentence) continue;
          var dup = false;
          for (var z = 0; z < parts.length; z++) if (answerAgreement(sentence, parts[z]) > 0.78) { dup = true; break; }
          if (dup) continue;
          origins[origin] = 1; parts.push(sentence); chosen.push(r);
        }
        text = completeResearchText(parts.join(" "), 720);
      }
    }

    chosen = chosen.filter(function (r, i, a) { return r && a.indexOf(r) === i; });
    var labels = [], urls = [];
    chosen.slice(0, 3).forEach(function (r) {
      if (r.x && labels.indexOf(r.x) < 0) labels.push(r.x);
      if (r.s && urls.indexOf(r.s) < 0) urls.push(r.s);
    });
    return { text: text, sources: urls, used: labels,
             research: { features: top._researchFeatures || null, row: top }, researchRows: ranked };
  }

  var researchMemory = [];
  try { researchMemory = JSON.parse(localStorage.getItem(RESEARCH_MEMORY_KEY) || "[]"); if (!Array.isArray(researchMemory)) researchMemory = []; } catch (e) { researchMemory = []; }

  /* Research-to-dataset boundary: keep only the already-filtered evidence and
     final answer in a separate memory. Raw web snippets never get injected into
     CELL4's own passage index, which was the contamination bug behind the
     Wikipedia-only answers. */
  function absorb(rows, question, result) {
    if (!rows || !rows.length || !result || !result.text) return;
    var evidence = (result.researchRows || rows).slice(0, 6).map(function (r) {
      return { kind: "source", h: r.h, t: completeResearchText(r.t, 520), s: r.s,
               source: r.x, score: Math.round((r.ai || 0) * 1000) / 1000,
               answer: r.answer || "" };
    });
    /* Three kinds of remembered thing, kept apart on purpose:
         kind:"source"     read out of a source -- may corroborate a claim
         kind:"generated"  written by this page -- may NEVER corroborate one
         the reranker's weights (localStorage) -- user preference, not fact
       Nothing reads `generated` back into ranking or evidence, and the label is
       here so that a future change cannot blur the boundary by accident. A
       generated answer is not evidence for its own correctness. */
    researchMemory.unshift({ q: question, kind: "generated", a: result.text,
                             t: Date.now(), evidence: evidence });
    researchMemory = researchMemory.slice(0, 80);
    try { localStorage.setItem(RESEARCH_MEMORY_KEY, JSON.stringify(researchMemory)); } catch (e) {}
  }

  /* ================================================================== ASTRON
   * TEXT BRIDGE
   *
   * A real connection to the training system, not a comment claiming one.
   *
   * ASTRON has no daemon and listens on no port -- README.OPS.md is explicit
   * about that -- so `/astron/xyz/` is a served directory, not an inference
   * API. The connection is therefore static and same-origin:
   *
   *     astron/xyz/text/train.py   fits the model offline
   *       -> policy/text_gabriel_lm.json      (family head + candidate head)
   *       -> data/conversation_pack.json      (dialogue acts + response plans)
   *     -> this page fetches them same-origin, versioned and cached
   *     -> the arithmetic below is the same arithmetic train.py fitted
   *
   * `text/bench.py --conformance` dumps the Python side's signatures, tiers and
   * family distribution for a fixed query list and diffs them against what this
   * file computes. If the two ever drift the browser would be scoring against
   * features the model was never fitted on, so that check is a build gate, not
   * a nicety.
   *
   * Everything degrades. No artifact, a malformed artifact, a blocked fetch or
   * a corrupted cache all end in the deterministic ranking that shipped before
   * this bridge existed.
   * ================================================================== */

  var TEXT_MODEL_URL = "/astron/xyz/policy/text_gabriel_lm.json";
  var CONV_PACK_URL = "/astron/xyz/data/conversation_pack.json";
  var TEXT_MODEL_KEY = "robots.text.model.v1";
  var CONV_PACK_KEY = "robots.conv.pack.v1";
  var ARTIFACT_TTL = 24 * 3600 * 1000;
  var ARTIFACT_TIMEOUT = 4500;

  /* Stop list. The exported model ships its own copy so the browser tokenises
     exactly as the fit did; this is the fallback for a missing artifact. */
  var TS_STOP_DEFAULT = ("a an the of for to in on at by with from as is are was were be been being am " +
    "do does did done have has had having will would can could should may might " +
    "must shall about into over under and or but not no nor so yet if then than " +
    "that this these those it its it's i you he she they we me him her them us my " +
    "your his their our what which who whom whose when where why how").split(" ");

  var textModel = null;      /* parsed policy/text_gabriel_lm.json */
  var convPack = null;       /* parsed data/conversation_pack.json */
  var textModelState = "loading";
  var convPackState = "loading";
  /* The last answer, kept for `robots.last()`. Read-only introspection: it is
     written after the decision, never read by one. */
  var lastAnswer = null;
  var tsStop = null;         /* Object map, built from whichever list is live */

  function tsStopSet() {
    if (tsStop) return tsStop;
    var list = (textModel && textModel.stop && textModel.stop.length) ? textModel.stop : TS_STOP_DEFAULT;
    tsStop = Object.create(null);
    for (var i = 0; i < list.length; i++) tsStop[list[i]] = 1;
    return tsStop;
  }

  /* ---------------------------------------------------------- artifact load
     Cached in localStorage against the artifact's own content hash, so a
     redeploy invalidates the copy and an unchanged file is never re-parsed.
     A corrupt cache entry is dropped rather than thrown. */
  function loadArtifact(url, key, cb) {
    var cached = null;
    try {
      var raw = localStorage.getItem(key);
      if (raw) {
        var c = JSON.parse(raw);
        if (c && c.doc && c.t && (Date.now() - c.t) < ARTIFACT_TTL) cached = c.doc;
      }
    } catch (e) { try { localStorage.removeItem(key); } catch (e2) {} }
    if (cached) { cb(cached, "cache"); return; }

    var done = false, ctl = null;
    try { ctl = new AbortController(); } catch (e) {}
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      cb(null, "timeout");
    }, ARTIFACT_TIMEOUT);
    var opts = { referrerPolicy: "no-referrer", cache: "default" };
    if (ctl) opts.signal = ctl.signal;
    fetch(url, opts)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) {
        if (done) return;
        done = true; clearTimeout(timer);
        if (!j || typeof j !== "object") { cb(null, "malformed"); return; }
        try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), doc: j })); } catch (e) {}
        cb(j, "network");
      })
      .catch(function () {
        if (done) return;
        done = true; clearTimeout(timer);
        cb(null, "unreachable");
      });
  }

  /* ------------------------------------------------------ signature mirror
     Character-for-character the same decisions as text/signatures.py. */

  var TS_WORD = /[a-z0-9][a-z0-9'+#._-]*/g;

  function tsRawTokens(s) {
    var m = String(s == null ? "" : s).toLowerCase().match(TS_WORD) || [], out = [];
    for (var i = 0; i < m.length; i++) out.push(m[i].replace(/[._-]+$/, ""));
    return out;
  }

  function tsTokens(s) {
    var raw = tsRawTokens(s), stop = tsStopSet(), out = [];
    for (var i = 0; i < raw.length; i++)
      if (raw[i].length > 1 && !stop[raw[i]]) out.push(raw[i]);
    return out;
  }

  var TS_PREAMBLE = /^\s*(?:(?:ok(?:ay)?|so|well|right|alright|anyway|anyways|actually|but|hey|hi|hello|yo|um|uh|hmm)\b[\s,]*)+/i;
  var TS_FORGET = /^\s*(?:never\s*mind|forget (?:that|it|about that)|(?:new|different|unrelated) (?:question|topic|subject)|(?:changing|switching) (?:the )?(?:topic|subject))\b[\s,:-]*/i;
  /* "what's X" is a copula, not a possessive. Missing this alternative left the
     whole question in the subject slot, which is why the possessive rule below
     also has to refuse a bare interrogative on its left-hand side. */
  var TS_LEAD = /^\s*(?:what(?:'s|’s|s)?|which|who(?:'s|’s|s)?|whom|whose)\s+(?:is|are|was|were)\s+(?:the\s+|an?\s+)?|^\s*(?:what|which|who)(?:'s|’s)\s+(?:the\s+|an?\s+)?|^\s*(?:what(?:'s|s)?|which)\s+(?:does|do|did)\s+|^\s*(?:define|describe)\s+|^\s*(?:meaning|definition)\s+of\s+|^\s*(?:tell\s+me\s+about|tell\s+me|talk\s+about|explain|info\s+on|information\s+about)\s+|^\s*(?:could|can|would)\s+you\s+(?:please\s+)?(?:explain|describe|define|tell\s+me\s+about)\s+/i;
  /* Same alternation as TS_LEAD with the determiner group removed, so "what is
     the matrix" yields both "matrix" and "the matrix" as subject hypotheses. */
  var TS_LEAD_KEEP = /^\s*(?:what(?:'s|’s|s)?|which|who(?:'s|’s|s)?|whom|whose)\s+(?:is|are|was|were)\s+|^\s*(?:what|which|who)(?:'s|’s)\s+|^\s*(?:what(?:'s|s)?|which)\s+(?:does|do|did)\s+|^\s*(?:define|describe)\s+|^\s*(?:meaning|definition)\s+of\s+|^\s*(?:tell\s+me\s+about|tell\s+me|talk\s+about|explain|info\s+on|information\s+about)\s+|^\s*(?:could|can|would)\s+you\s+(?:please\s+)?(?:explain|describe|define|tell\s+me\s+about)\s+/i;
  var TS_TRAIL = /\s+(?:mean|means|meaning|about)\s*$/i;

  /* Order is load-bearing: the first match wins, so the specific shape sits
     above the shape that would otherwise swallow it. Mirrors text/signatures.py
     _FORMS exactly, including the order. */
  var TS_FORMS = [
    ["social", /^\s*(?:what|how)(?:'s|’s)?\s+(?:up|good|new|going)\b/i],
    ["meta", /^\s*(?:what|who|how)(?:'s|’s)?\s+(?:are|is|do|did|does)?\s*(?:you|u)\s*[?.!]*$|^\s*(?:what|which)(?:'s|’s)?\s+(?:is\s+)?your\b|\b(?:you|your|u|ur)\s+(?:\w+\s+)?(?:sound|sounds|are|were|think|thinks|feel|feels|name|prefer|like|know|remember|talk|talking|doing|there|ok|okay|alive|real|human|bot|ai)\b/i],
    ["compare", /\b(?:vs\.?|versus|compared? (?:to|with)|difference between)\b|^\s*compare\b|^\s*set\b.+\bagainst\b/i],
    ["howwork", /^\s*(?:explain\s+)?how\s+(?:does|do|did|is|are|was|were)\b.*\b(?:work|works|worked|happen|happens|made|formed|produced)\b|^\s*break\s+down\s+how\b/i],
    ["howto", /^\s*how\s+(?:to|do|does|did|can|could|should|would)\b|^\s*walk\s+me\s+through\b/i],
    ["why", /^\s*why\b|^\s*explain\b/i],
    ["whois", /^\s*who(?:'s|’s)?\s+(?:is|are|was|were|exactly)\b|^\s*who\s+(?:is|are|was|were)\b|^\s*tell\s+me\s+who\b|^\s*who(?:'s|’s)\s/i],
    ["whatis", /^\s*(?:what|which)(?:'s|’s|s)\s|^\s*(?:what|which)\s+(?:is|are|was|were)\b|^\s*(?:what|which)\s+(?:does|do|did)\s+(?!(?:you|u|ya|ur|your)\b)/i],
    ["define", /^\s*(?:define|describe|definition of|meaning of|remind me what|give me a rundown|what would you call)\b/i],
    ["tellme", /^\s*(?:tell me about|tell me|talk about|info on|information about|i want to know about)\b/i],
    ["when", /^\s*when\s+(?:is|are|was|were|did|does|do)\b/i],
    ["where", /^\s*where\s+(?:is|are|was|were)\b/i],
    ["list", /^\s*(?:list|show me|give me|name)\b/i],
    ["social", /^\s*(?:what|how)(?:'s|’s)?\s+(?:do|are|is)?\s*(?:you|u|ya)\b|^\s*(?:how|what)(?:'s|’s)?\s+(?:it|things|life)\b/i]
  ];

  function tsQueryForm(raw) {
    var text = String(raw == null ? "" : raw).trim();
    var stripped = text.replace(TS_FORGET, "").replace(TS_PREAMBLE, "").trim();
    if (stripped) text = stripped;
    for (var i = 0; i < TS_FORMS.length; i++)
      if (TS_FORMS[i][1].test(text)) return TS_FORMS[i][0];
    if (/\?\s*$/.test(text)) return "bare_q";
    return "bare";
  }

  function tsClean(v) {
    var s = String(v == null ? "" : v).replace(/\s+/g, " ").trim()
      .replace(/^[,;:\-–—\s]+|[,;:\-–—\s]+$/g, "");
    return s.replace(/^(?:the|a|an)\s+/i, "").trim();
  }

  function tsSplit(raw) {
    var text = String(raw == null ? "" : raw).trim().replace(/[?!.]+\s*$/, "");
    text = text.replace(TS_FORGET, "").replace(TS_PREAMBLE, "");
    var work = text.replace(TS_LEAD, "").replace(TS_TRAIL, "").trim();
    work = work.replace(/^(?:the|a|an)\s+/i, "").trim();
    if (!work) return { subject: "", relation: "", parse: "bare" };
    var m = work.match(/^(.+?)['’]s\s+(.+)$/);
    if (m && !/^(?:what|which|who|that|there|here|it|he|she|let|lets|how|where|when|why)$/i.test(String(m[1]).trim()))
      return { subject: tsClean(m[1]), relation: tsClean(m[2]), parse: "possessive" };
    m = work.match(/^(.{1,70}?)\s+(?:of|for|about)\s+(.+)$/i);
    if (m) return { subject: tsClean(m[2]), relation: tsClean(m[1]), parse: "relation" };
    m = work.match(/^([a-z][a-z0-9 _+.#-]{1,34})\s+in\s+(.+)$/i);
    if (m) return { subject: tsClean(m[2]), relation: tsClean(m[1]), parse: "relation" };
    /* The article-keeping hypothesis has to be built from a lead-strip that
       never consumed the article in the first place -- taking `work` here was
       reading it back after it had already been thrown away, so the two
       hypotheses were always identical and the alternative never ran. */
    var workAlt = String(raw == null ? "" : raw).trim().replace(/[?!.]+\s*$/, "")
      .replace(TS_FORGET, "").replace(TS_PREAMBLE, "")
      .replace(TS_LEAD_KEEP, "").replace(TS_TRAIL, "").trim();
    return { subject: tsClean(work), relation: "", parse: "bare",
             subjectAlt: tsCleanKeepArticle(workAlt) };
  }

  /* "what is the capital of France" needs the article stripped; "what is the
     matrix" needs it kept, because there the article is part of the name. The
     grammar cannot tell these apart, so it does not try: it produces BOTH
     subject hypotheses and the identity ladder decides which one the
     encyclopedia actually knows. Model proposes, verifier disposes. */
  function tsCleanKeepArticle(v) {
    return String(v == null ? "" : v).replace(/\s+/g, " ").trim()
      .replace(/^[,;:\-–—\s]+|[,;:\-–—\s]+$/g, "");
  }

  function tsCaseShape(s) {
    var words = String(s == null ? "" : s).trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "none";
    var alpha = words.filter(function (w) { return /[A-Za-z]/.test(w); });
    if (!alpha.length) return "none";
    var upper = 0, titled = 0;
    for (var i = 0; i < alpha.length; i++) {
      var w = alpha[i];
      if (w === w.toUpperCase() && w.length > 1) upper++;
      else if (w.charAt(0) === w.charAt(0).toUpperCase() && w !== w.toUpperCase()) titled++;
    }
    if (upper === alpha.length) return "upper";
    if (titled === alpha.length) return "title";
    if (titled || upper) return "mixed";
    return "lower";
  }

  var TS_CONVO = ["hey", "hi", "hello", "yo", "sup", "howdy", "morning", "evening",
    "thanks", "thank", "thx", "ty", "cheers", "please", "sorry", "oops",
    "lol", "lmao", "haha", "hah", "heh", "bruh", "bro", "dude", "man",
    "nah", "yeah", "yep", "yup", "nope", "ok", "okay", "alright", "cool",
    "sure", "exactly", "mhm", "mm", "yea", "aight",
    "nice", "sweet", "damn", "wow", "huh", "hmm", "wait", "oh", "ah",
    "bored", "tired", "sad", "happy", "weird", "crazy", "fine", "meh"];
  var TS_SHIFT = ["anyway", "anyways", "actually", "nevermind", "never", "forget",
    "different", "instead", "switching", "switch", "unrelated", "aside",
    "changing", "moving", "new"];
  var TS_CONT = ["more", "continue", "go", "elaborate", "expand", "further", "else",
    "also", "and", "next", "keep", "again"];
  var TS_PRON = ["he", "she", "it", "they", "him", "her", "them", "his", "hers",
    "their", "theirs", "its", "that", "this", "those", "these", "one"];

  /* Multi-word social cues. A single-token list cannot see "how have you been"
     or "that's not what I meant". Mirrors text/signatures.py SOCIAL_PHRASE. */
  var TS_SOCIAL_PHRASE = /\b(?:how (?:have you been|are you|is it going|'?s it going|you doing)|can we talk|let'?s talk|talk to me|wanna chat|(?:that'?s )?not what i meant|no worries|my bad|fair enough|makes sense|good point|sounds good|got it|i see|never ?mind|who made you|what are you|are you (?:an? )?(?:ai|bot|robot|human|real)|that'?s (?:wild|cool|neat|nice|crazy|fair|true|right))\b/i;

  function tsHasAny(toks, words) {
    var s = Object.create(null), i;
    for (i = 0; i < toks.length; i++) s[toks[i]] = 1;
    for (i = 0; i < words.length; i++) if (s[words[i]]) return true;
    return false;
  }

  function tsBucket(n, edges) {
    for (var i = 0; i < edges.length; i++) if (n <= edges[i]) return i;
    return edges.length;
  }

  function tsSignatures(raw, state, siteLexicon) {
    var text = String(raw == null ? "" : raw).trim();
    var sr = tsSplit(text);
    var subj = tsTokens(sr.subject), rel = tsTokens(sr.relation);
    var allRaw = tsRawTokens(text), allTok = tsTokens(text);
    var sig = [];
    sig.push("form:" + tsQueryForm(text));
    sig.push("parse:" + sr.parse);
    sig.push("len:" + String(Math.min(subj.length, 4)));
    sig.push("qlen:" + String(tsBucket(allRaw.length, [1, 2, 4, 7, 12])));
    sig.push("sub:" + String(tsBucket(sr.subject.length, [0, 6, 14, 30])));
    sig.push("rel:" + (rel.length ? String(Math.min(rel.length, 3)) : "none"));
    sig.push("case:" + tsCaseShape(sr.subject ? sr.subject : text));
    var uniq = Object.create(null), dup = false, i;
    for (i = 0; i < subj.length; i++) { if (uniq[subj[i]]) dup = true; uniq[subj[i]] = 1; }
    sig.push("dup:" + (dup ? "yes" : "no"));
    sig.push("punct:" + (/\?$/.test(text) ? "q" : "none"));
    if (text.indexOf('"') >= 0 || text.indexOf("“") >= 0) sig.push("punct:quoted");
    sig.push("convo:" + (tsHasAny(allRaw, TS_CONVO) ? "yes" : "no"));
    if (TS_SOCIAL_PHRASE.test(text)) sig.push("convo:phrase");
    sig.push("shift:" + (tsHasAny(allRaw, TS_SHIFT) ? "yes" : "no"));
    sig.push("cont:" + ((tsHasAny(allRaw, TS_CONT) && allRaw.length <= 5) ? "yes" : "no"));
    sig.push("pron:" + ((tsHasAny(allRaw, TS_PRON) && subj.length <= 2) ? "yes" : "no"));
    var lex = Object.create(null), any = false, j;
    var lexList = siteLexicon || [];
    for (i = 0; i < lexList.length; i++) {
      var lt = tsTokens(lexList[i]);
      for (j = 0; j < lt.length; j++) lex[lt[j]] = 1;
    }
    for (i = 0; i < allTok.length; i++) if (lex[allTok[i]]) { any = true; break; }
    sig.push("site:" + (any ? "yes" : "no"));
    if (state && (state.subject || state.turns)) {
      var prior = tsTokens(state.subject || ""), overlap = 0;
      for (i = 0; i < prior.length; i++)
        for (j = 0; j < subj.length; j++) if (prior[i] === subj[j]) { overlap++; break; }
      if (!prior.length) sig.push("ctx:fresh");
      else if (overlap && subj.length) sig.push("ctx:same");
      else if (subj.length) sig.push("ctx:new");
      else sig.push("ctx:carry");
      sig.push("depth:" + String(tsBucket(Number(state.turns || 0), [0, 1, 3, 6])));
    } else {
      sig.push("ctx:fresh");
      sig.push("depth:0");
    }
    return sig;
  }

  /* ------------------------------------------------------- identity ladder
     A TOKEN SET IS ALLOWED FOR COVERAGE. A TOKEN SET IS NOT SUFFICIENT FOR
     IDENTITY. Everything below preserves order and multiplicity and keeps stop
     words, because `matrix` and `the matrix` differ by exactly one word a
     coverage filter throws away, and `high school` and `High School High`
     differ by exactly one duplicate a set throws away. */

  var TIER_VERIFIED_TITLE = 5, TIER_VERIFIED_ALIAS = 4, TIER_EXACT_PHRASE = 3,
      TIER_COHERENT = 2, TIER_EXPANDED = 1, TIER_FUZZY = 0;
  var TIER_NAMES = { 5: "verified_title", 4: "verified_alias", 3: "exact_phrase",
                     2: "coherent", 1: "expanded", 0: "fuzzy" };

  function splitQualifier(title) {
    var t = String(title == null ? "" : title).replace(/\s+/g, " ").trim();
    var m = t.match(/\s*\(([^)]{1,60})\)\s*$/);
    if (!m) return { base: t, qualifier: "" };
    return { base: t.slice(0, m.index).trim(), qualifier: m[1].trim() };
  }

  function identityTokens(phrase) {
    var base = splitQualifier(phrase).base.toLowerCase().replace(/[^a-z0-9'\s]+/g, " ");
    return base.split(/\s+/).filter(Boolean);
  }

  function identityKey(phrase) { return identityTokens(phrase).join(" "); }

  function identityEqual(a, b) {
    var ka = identityKey(a), kb = identityKey(b);
    return !!ka && ka === kb;
  }

  function orderedContainment(query, title) {
    var qt = identityTokens(query), ht = identityTokens(title);
    if (!qt.length || !ht.length || ht.length < qt.length) return { ok: false, extras: 0 };
    var qi = 0;
    for (var i = 0; i < ht.length; i++) if (qi < qt.length && ht[i] === qt[qi]) qi++;
    if (qi !== qt.length) return { ok: false, extras: 0 };
    return { ok: true, extras: ht.length - qt.length };
  }

  /* True when a set comparison would call these the same name and identity does
     not. This is the named regression from the previous build; `robots.selfTest()`
     asserts it stays true for ("high school", "High School High"). */
  function duplicateMismatch(query, title) {
    var qt = identityTokens(query), ht = identityTokens(title), i;
    if (!qt.length || !ht.length) return false;
    var sa = Object.create(null), sb = Object.create(null), na = 0, nb = 0;
    for (i = 0; i < qt.length; i++) if (!sa[qt[i]]) { sa[qt[i]] = 1; na++; }
    for (i = 0; i < ht.length; i++) if (!sb[ht[i]]) { sb[ht[i]] = 1; nb++; }
    if (na !== nb) return false;
    for (i = 0; i < qt.length; i++) if (!sb[qt[i]]) return false;
    if (qt.length !== ht.length) return true;
    for (i = 0; i < qt.length; i++) if (qt[i] !== ht[i]) return true;
    return false;
  }

  function tsCoverage(phrase, text) {
    var need = tsTokens(phrase), got = tsTokens(text), i, j, hit = 0;
    if (!need.length) return 0;
    var seen = Object.create(null);
    for (j = 0; j < got.length; j++) seen[got[j]] = 1;
    var counted = Object.create(null);
    for (i = 0; i < need.length; i++) {
      if (counted[need[i]]) continue;
      counted[need[i]] = 1;
      if (seen[need[i]]) hit++;
    }
    var uniqNeed = 0;
    var un = Object.create(null);
    for (i = 0; i < need.length; i++) if (!un[need[i]]) { un[need[i]] = 1; uniqNeed++; }
    return uniqNeed ? hit / uniqNeed : 0;
  }

  /* The whole point of the ladder: a candidate either can or cannot be the
     thing that was named, and that decision is made here, below every weight. */
  function senseTier(asked, cand) {
    var a = String(asked || "").trim(), title = String((cand && cand.title) || "");
    if (!a || !title) return { tier: TIER_FUZZY, reason: "no-phrase" };
    if (cand.verifiedTitle) {
      var alias = String(cand.alias || "");
      if (alias && identityEqual(alias, a)) return { tier: TIER_VERIFIED_TITLE, reason: "redirect-from-asked" };
      if (identityEqual(title, a)) return { tier: TIER_VERIFIED_TITLE, reason: "exact-title" };
      return { tier: TIER_VERIFIED_ALIAS, reason: "verified-alias" };
    }
    if (identityEqual(title, a)) return { tier: TIER_EXACT_PHRASE, reason: "identity-equal" };
    var cont = orderedContainment(a, title);
    if (cont.ok && cont.extras > 0)
      return { tier: TIER_EXPANDED, reason: "expanded+" + cont.extras };
    if (Number(cand.coherence || 0) >= 0.55 && tsCoverage(a, cand.text || title) >= 0.5)
      return { tier: TIER_COHERENT, reason: "coherent-sense" };
    return { tier: TIER_FUZZY, reason: "lexical" };
  }

  /* Once any candidate reaches EXACT_PHRASE or better, nothing at EXPANDED or
     below may be answered. This is a hard rule: no learned weight, no thumbs
     up, no source ranking can lift a candidate across the boundary. */
  function pruneByTier(asked, cands, focused) {
    var scored = [], i, best = -1;
    for (i = 0; i < cands.length; i++) {
      var t = senseTier(asked, cands[i]);
      cands[i].tier = t.tier;
      cands[i].tierReason = t.reason;
      cands[i].tierName = TIER_NAMES[t.tier];
      if (t.tier > best) best = t.tier;
      scored.push(cands[i]);
    }
    if (!focused || best < 0) return { kept: scored, best: best };
    var floor = best >= TIER_EXACT_PHRASE ? TIER_EXPANDED + 1 : 0;
    var kept = [];
    for (i = 0; i < scored.length; i++) if (scored[i].tier >= floor) kept.push(scored[i]);
    return { kept: kept, best: best };
  }

  function grammaticalFamilies(raw, siteLexicon, state) {
    var sig = tsSignatures(raw, state, siteLexicon), has = Object.create(null), i;
    for (i = 0; i < sig.length; i++) has[sig[i]] = 1;
    var sr = tsSplit(raw), form = tsQueryForm(raw), out = [];
    if (has["site:yes"]) out.push("site");
    if (form === "compare") out.push("comparison");
    if (form === "howto") { out.push("howto"); out.push("explanation"); }
    if (form === "howwork") { out.push("explanation"); out.push("definition"); }
    if (form === "why") { out.push("explanation"); out.push("definition"); }
    if (sr.relation && sr.subject) out.push("relational_fact");
    if (form === "whois" || /\bwho\b/i.test(String(raw || ""))) out.push("identity");
    if (form === "whatis" || form === "define" || form === "tellme" ||
        form === "bare_q" || form === "when" || form === "where" || form === "list")
      out.push("definition");
    if (form === "bare" && sr.subject && has["convo:no"]) out.push("definition");
    if (has["convo:yes"] || form === "meta" || form === "social" ||
        (form === "bare" && !sr.subject)) out.push("conversational");
    /* Anaphora and continuation resolve against dialogue state, so the family
       is whatever the previous turn was about: both branches stay open and the
       model decides. Omitting this rule here while text/families.py had it was
       a real divergence, and the conformance check is what found it. */
    if (has["pron:yes"] || has["cont:yes"]) {
      out.push("definition");
      out.push("conversational");
    }
    /* A short utterance with no interrogative shape can be a social turn -- but
       only when it is not already a content question. "capital of France" is
       six tokens with no question word, and admitting `conversational` for it
       would put a factual lookup on the same ballot as small talk. */
    if ((form === "bare" || form === "bare_q" || form === "social" || form === "meta") &&
        tsRawTokens(raw).length <= 6) {
      if (!sr.subject ||
          (!sr.relation && (has["convo:yes"] || has["convo:phrase"] ||
                            has["pron:yes"] || has["cont:yes"])) ||
          form === "social" || form === "meta") out.push("conversational");
    }
    if (!out.length) { out.push("definition"); out.push("conversational"); }
    var seen = Object.create(null), uniq = [];
    for (i = 0; i < out.length; i++) if (!seen[out[i]]) { seen[out[i]] = 1; uniq.push(out[i]); }
    return uniq;
  }

  /* ------------------------------------------------------ model inference
     The same sparse log-linear arithmetic text/lm.py fitted. Sixty lines,
     because the model is sparse and linear on purpose. */

  var TS_PAIR_GROUPS = [["form", "len"], ["form", "case"], ["form", "convo"],
    ["form", "ctx"], ["case", "len"], ["ctx", "pron"], ["shift", "ctx"], ["cont", "ctx"]];

  function tsGroup(t) { var i = t.indexOf(":"); return i < 0 ? t : t.slice(0, i); }

  function queryFeatures(sigs) {
    var feats = ["b"], byGroup = Object.create(null), i, j, k;
    for (i = 0; i < sigs.length; i++) {
      feats.push("s|" + sigs[i]);
      var g = tsGroup(sigs[i]);
      (byGroup[g] || (byGroup[g] = [])).push(sigs[i]);
    }
    var pg = (textModel && textModel.contract && textModel.contract.pair_groups) || TS_PAIR_GROUPS;
    for (i = 0; i < pg.length; i++) {
      var A = byGroup[pg[i][0]] || [], Bg = byGroup[pg[i][1]] || [];
      for (j = 0; j < A.length; j++) for (k = 0; k < Bg.length; k++)
        feats.push("c|" + A[j] + "|" + Bg[k]);
    }
    return feats;
  }

  function tsSoftmax(logits) {
    var keys = Object.keys(logits), i, peak = -Infinity, out = {}, z = 0;
    if (!keys.length) return out;
    for (i = 0; i < keys.length; i++) if (logits[keys[i]] > peak) peak = logits[keys[i]];
    for (i = 0; i < keys.length; i++) { out[keys[i]] = Math.exp(logits[keys[i]] - peak); z += out[keys[i]]; }
    if (!z) z = 1;
    for (i = 0; i < keys.length; i++) out[keys[i]] /= z;
    return out;
  }

  function familyDist(raw, state, siteLexicon) {
    var allowed = grammaticalFamilies(raw, siteLexicon, state), i, out = {};
    if (!textModel || !textModel.family_weights) {
      for (i = 0; i < allowed.length; i++) out[allowed[i]] = 1 / allowed.length;
      return out;
    }
    var feats = queryFeatures(tsSignatures(raw, state, siteLexicon)), logits = {};
    for (i = 0; i < allowed.length; i++) logits[allowed[i]] = 0;
    for (i = 0; i < feats.length; i++) {
      var row = textModel.family_weights[feats[i]];
      if (!row) continue;
      for (var f in logits) { var v = row[f]; if (v) logits[f] += v; }
    }
    return tsSoftmax(logits);
  }

  function candidateSignature(asked, cand) {
    var title = String((cand && cand.title) || "");
    var cont = orderedContainment(asked, title), sq = splitQualifier(title);
    var cov = tsCoverage(asked, (cand.text || "") + " " + title);
    var coh = Number(cand.coherence || 0), conc = Number(cand.concentration || 0);
    return [
      "tier:" + (TIER_NAMES[Number(cand.tier || 0)] || "fuzzy"),
      "exp:" + (!cont.ok ? "no" : String(Math.min(cont.extras, 3))),
      "cov:" + String(tsBucket(cov, [0.0, 0.34, 0.67, 0.99])),
      "coh:" + String(tsBucket(coh, [0.2, 0.4, 0.6, 0.8])),
      "conc:" + String(tsBucket(conc, [0.2, 0.5, 0.8])),
      "src:" + String(cand.source || "unknown"),
      "rank:" + String(tsBucket(Number(cand.rank == null ? 9 : cand.rank), [0, 1, 2, 4])),
      "qual:" + (sq.qualifier ? "yes" : "no"),
      "dis:" + (cand.disambiguation ? "yes" : "no"),
      "read:" + (cand.fullText ? "yes" : "no"),
      "dup:" + (duplicateMismatch(asked, title) ? "yes" : "no"),
      "tlen:" + String(tsBucket(identityTokens(sq.base).length, [1, 2, 3, 5]))
    ];
  }

  function candidateFeatures(qsigs, csigs) {
    var feats = ["b"], i, j;
    for (i = 0; i < csigs.length; i++) feats.push("d|" + csigs[i]);
    for (i = 0; i < qsigs.length; i++) {
      if (!/^(?:form|len|case|dup):/.test(qsigs[i])) continue;
      for (j = 0; j < csigs.length; j++) feats.push("x|" + qsigs[i] + "|" + csigs[j]);
    }
    return feats;
  }

  function candidateScore(qsigs, csigs) {
    if (!textModel || !textModel.candidate_weights) return 0;
    var feats = candidateFeatures(qsigs, csigs), z = 0;
    for (var i = 0; i < feats.length; i++) {
      var v = textModel.candidate_weights[feats[i]];
      if (v) z += v;
    }
    return z;
  }

  /* ------------------------------------------------------- dialogue state
     Topic coherence has to survive more than one message, and has to die on
     command. Keyword overlap alone would do neither: it drags a stale subject
     into an unrelated question, and it clings when the user explicitly moves
     on. So the state is explicit, decays, and is reset by grammar rather than
     by similarity. */

  function DialogueState() {
    this.subject = "";        /* the phrase the user named */
    this.entity = "";         /* the canonical title it resolved to */
    this.relation = "";
    this.confidence = 0;
    this.turns = 0;
    this.lastAct = "";
    this.lastPlan = -1;
    this.source = "";
    this.prior = [];          /* recent (subject, entity) pairs, newest first */
  }

  DialogueState.prototype.snapshot = function () {
    return { subject: this.subject, entity: this.entity, relation: this.relation,
             confidence: this.confidence, turns: this.turns, lastAct: this.lastAct,
             source: this.source, prior: this.prior.slice(0, 4) };
  };

  /* An explicit shift wins over everything. A new concrete subject replaces the
     old one outright rather than blending with it -- "decay old context
     aggressively when a new explicit subject appears". */
  DialogueState.prototype.plan = function (raw) {
    var sig = tsSignatures(raw, this.snapshot(), null), has = Object.create(null), i;
    for (i = 0; i < sig.length; i++) has[sig[i]] = 1;
    var sr = tsSplit(raw), subj = tsTokens(sr.subject);
    var explicitShift = has["shift:yes"] || TS_FORGET.test(String(raw || ""));
    var wantsCarry = has["pron:yes"] || has["cont:yes"];
    if (explicitShift && subj.length) return { action: "reset", subject: sr.subject };
    if (explicitShift) return { action: "clear", subject: "" };
    if (subj.length >= 1 && !wantsCarry) {
      if (!this.subject) return { action: "set", subject: sr.subject };
      var overlap = 0;
      var prior = tsTokens(this.subject);
      for (i = 0; i < subj.length; i++)
        for (var j = 0; j < prior.length; j++) if (subj[i] === prior[j]) { overlap++; break; }
      if (!overlap) return { action: "reset", subject: sr.subject };
      return { action: "refine", subject: sr.subject };
    }
    if (wantsCarry && this.subject) return { action: "carry", subject: this.subject };
    if (subj.length) return { action: "set", subject: sr.subject };
    return { action: "hold", subject: this.subject };
  };

  /* Resolve an anaphor to the current subject, but only when there is a subject
     recent and confident enough to carry. A stale topic is worse than none. */
  DialogueState.prototype.resolve = function (raw) {
    var p = this.plan(raw);
    if (p.action === "carry" && this.confidence >= 0.35) {
      return { subject: this.subject, entity: this.entity, carried: true, action: p.action };
    }
    if (p.action === "carry") return { subject: "", entity: "", carried: false, action: "hold" };
    return { subject: p.subject, entity: (p.action === "refine" ? this.entity : ""),
             carried: false, action: p.action };
  };

  DialogueState.prototype.commit = function (raw, resolved, result) {
    this.turns++;
    var action = (resolved && resolved.action) || "hold";
    if (action === "clear") {
      this.prior.unshift({ s: this.subject, e: this.entity });
      this.subject = ""; this.entity = ""; this.relation = ""; this.confidence = 0;
    } else if (action === "reset" || action === "set") {
      if (this.subject) this.prior.unshift({ s: this.subject, e: this.entity });
      this.subject = resolved.subject || "";
      this.entity = (result && result.entity) || "";
      this.relation = (result && result.relation) || "";
      this.confidence = (result && result.confidence) || 0;
      this.source = (result && result.source) || "";
    } else if (action === "refine" || action === "carry") {
      if (resolved.subject) this.subject = resolved.subject;
      if (result && result.entity) this.entity = result.entity;
      if (result && result.relation) this.relation = result.relation;
      if (result && result.confidence != null)
        /* Confidence decays with distance from the turn that established it. */
        this.confidence = Math.max(result.confidence, this.confidence * 0.7);
      else this.confidence *= 0.7;
    } else {
      this.confidence *= 0.8;
    }
    this.prior = this.prior.slice(0, 6);
    if (result && result.act) this.lastAct = result.act;
    return this;
  };

  /* ---------------------------------------------------- conversation engine
     The pack controls HOW to speak: which act an utterance is, and which
     authored plan answers that act. It never supplies WHAT is true, and it
     ships no dataset text at all, so there is nothing for it to copy. */

  function convActFeatures(text, state) {
    var s = String(text == null ? "" : text).trim();
    var words = s.match(/[A-Za-z0-9']+/g) || [];
    var feats = ["b"], i, markers = (convPack && convPack.markers) || [];
    var fired = [];
    for (i = 0; i < markers.length; i++) {
      var rx;
      try { rx = new RegExp(markers[i][1], "i"); } catch (e) { continue; }
      if (rx.test(s)) { feats.push("m|" + markers[i][0]); fired.push("m|" + markers[i][0]); }
    }
    var n = words.length;
    feats.push("n|" + (n <= 1 ? "0" : n <= 3 ? "1" : n <= 7 ? "2" : n <= 14 ? "3" : "4"));
    feats.push("p|" + (/\?$/.test(s) ? "q" : /!$/.test(s) ? "x" : "."));
    if (state) {
      feats.push("t|" + (!state.turns ? "0" : Number(state.turns) <= 2 ? "1" : "2"));
      if (state.lastAct) feats.push("a|" + state.lastAct);
    }
    for (i = 0; i < fired.length; i++)
      for (var j = i + 1; j < fired.length; j++) feats.push("c|" + fired[i] + "|" + fired[j]);
    return feats;
  }

  function convAct(text, state) {
    if (!convPack || !convPack.act_model || !convPack.act_model.weights) return null;
    var acts = convPack.act_model.acts || convPack.acts || [];
    if (!acts.length) return null;
    var feats = convActFeatures(text, state), logits = {}, i;
    for (i = 0; i < acts.length; i++) logits[acts[i]] = 0;
    for (i = 0; i < feats.length; i++) {
      var row = convPack.act_model.weights[feats[i]];
      if (!row) continue;
      for (var a in logits) { var v = row[a]; if (v) logits[a] += v; }
    }
    var p = tsSoftmax(logits), bestA = "", bestV = -1;
    for (var k in p) if (p[k] > bestV || (p[k] === bestV && k < bestA)) { bestV = p[k]; bestA = k; }
    return { act: bestA, p: bestV, dist: p };
  }

  function convRender(act, state, seed, avoid) {
    if (!convPack || !convPack.plans) return null;
    var plans = convPack.plans[act] || convPack.plans.smalltalk || [];
    var topic = String((state && state.subject) || "").trim();
    var usable = [], i;
    for (i = 0; i < plans.length; i++) {
      var needs = plans[i][1] || [];
      if (needs.indexOf("topic") >= 0 && !topic) continue;
      usable.push({ i: i, skel: plans[i][0] });
    }
    if (!usable.length) return null;
    var start = ((seed % usable.length) + usable.length) % usable.length;
    for (i = 0; i < usable.length; i++) {
      var pick = usable[(start + i) % usable.length];
      if (avoid != null && pick.i === avoid && usable.length > 1) continue;
      return { text: pick.skel.split("{topic}").join(topic), plan: pick.i };
    }
    var f = usable[start];
    return { text: f.skel.split("{topic}").join(topic), plan: f.i };
  }

  /* ============================================ evidence -> facts -> answer
   *
   * The old path was: pick the best sentence, rewrite a few phrases, print it.
   * That is retrieval deciding what the question meant, and it is why an
   * expanded compound title could answer a bare concept.
   *
   * The path below is the ASTRA shape applied to prose:
   *
   *     article -> evidence windows -> propositions -> answer plan -> sentence
   *
   * A proposition is a small typed record (subject, kind, predicate, qualifier,
   * source sentence index). Nothing reaches the answer that is not backed by a
   * proposition, and no proposition exists that was not read out of source
   * evidence. Generated text is never fed back as evidence for itself.
   * ================================================================== */

  /* The determiner is captured, not discarded. Dropping it produced "Math rock
     is style of rock music" -- a proposition that cannot be rendered into a
     grammatical sentence no matter what the plan does with it. */
  var PROP_DEF = /^\s*(?:the\s+)?(.{1,90}?)\s+(is|are|was|were)\s+(a|an|the)\s+(.{3,240}?)\s*[.;]?\s*$/i;
  var PROP_DEF_BARE = /^\s*(?:the\s+)?(.{1,90}?)\s+(is|are|was|were)\s+(.{3,240}?)\s*[.;]?\s*$/i;
  var PROP_ALIAS = /\b(?:also (?:known|called|referred to)(?:\s+as)?|abbreviated|short for|sometimes called)\s+(.{2,90}?)\s*[,.;)]/i;
  var PROP_RELCLAUSE = /,\s*(?:which|who|that)\s+(.{5,200}?)\s*[,.;]/i;

  /* Prose that is about the page rather than about the subject. Rejected before
     anything is scored, so a navigation line can never become a "fact". */
  var META_PROSE = /\b(?:this article|this page|see also|for other uses|may refer to|disambiguation|citation needed|retrieved on|external links|main article|redirects here)\b/i;
  var LIST_PROSE = /^\s*(?:list of|index of|outline of|timeline of|category:|portal:)/i;

  function propKind(sentence, index) {
    var s = String(sentence || "");
    if (/\b(?:born|died|founded|established|released|launched|invented|discovered)\b/i.test(s))
      return "event";
    if (/\b(?:consists|comprises|contains|includes|made up of|composed of)\b/i.test(s))
      return "composition";
    if (/\b(?:used|use[sd]?|applies|applied|serves|purpose)\b/i.test(s)) return "use";
    if (index === 0 || /\b(?:is|are|was|were|refers to|describes|means)\b/i.test(s))
      return "definition";
    return "detail";
  }

  /* Read a small set of typed propositions out of evidence sentences. This is
     extraction, not generation: every field is a slice of a source sentence. */
  function extractPropositions(evidence, title, analysis, aliases) {
    var props = [], i, m;
    /* An article often names itself differently from the term the user typed:
       "high school" reaches an article whose first sentence starts "A secondary
       school is ...". Matching only against the display title made every such
       article fall through to the untyped branch, and the answer then read
       "High school - A secondary school is ...". Every known name of the page
       counts as its subject. */
    var names = [title].concat(aliases || []).filter(Boolean);
    /* Same profile idea as the evidence reader: a supporting sentence stays on
       topic by sharing the article's own vocabulary, not by naming the subject
       again. Without this every support proposition scored zero and a
       definition answer was one sentence long. */
    var prof = articleProfile(title, evidence, analysis);
    function subjectMatches(v) {
      for (var k = 0; k < names.length; k++) if (identityLooseMatch(v, names[k])) return true;
      return false;
    }
    for (i = 0; i < evidence.length && props.length < 10; i++) {
      var s = txtOf(evidence[i]);
      if (!s || s.length < 18) continue;
      if (META_PROSE.test(s)) continue;
      var kind = propKind(s, i), rec = null;
      m = s.match(PROP_DEF);
      if (m && subjectMatches(m[1])) {
        rec = { subject: txtOf(m[1]), copula: m[2].toLowerCase(),
                determiner: m[3].toLowerCase(), predicate: txtOf(m[4]),
                kind: "definition", i: i, src: s };
      }
      if (!rec) {
        m = s.match(PROP_DEF_BARE);
        if (m && subjectMatches(m[1])) {
          rec = { subject: txtOf(m[1]), copula: m[2].toLowerCase(),
                  determiner: "", predicate: txtOf(m[3]), kind: "definition", i: i, src: s };
        }
      }
      if (!rec) rec = { subject: title, copula: "", determiner: "",
                        predicate: "", kind: kind, i: i, src: s };
      m = s.match(PROP_ALIAS);
      if (m && m[1]) rec.alias = txtOf(m[1]);
      m = s.match(PROP_RELCLAUSE);
      if (m && m[1]) rec.qualifier = txtOf(m[1]);
      rec.topic = Math.max(sentenceTopicScore(analysis, s), profileOverlap(prof, s));
      props.push(rec);
    }
    return props;
  }

  function identityLooseMatch(a, b) {
    if (identityEqual(a, b)) return true;
    var at = identityTokens(a), bt = identityTokens(b), i, j, hit = 0;
    if (!at.length || !bt.length) return false;
    for (i = 0; i < at.length; i++)
      for (j = 0; j < bt.length; j++) if (at[i] === bt[j]) { hit++; break; }
    return hit / at.length >= 0.6 || hit / bt.length >= 0.6;
  }

  /* An answer PLAN: which propositions, in which order, for which intent.
     A definition leads with what the thing IS. It does not lead with history,
     etymology, a same-named film, or trivia -- those are `detail` and `event`
     propositions and the plan puts them after the definition or not at all. */
  function buildAnswerPlan(family, props, analysis, title, opts) {
    var lead = null, support = [], i;
    var skip = (opts && opts.skipLead) ? 1 : 0, seenDef = 0;
    /* "more" means past what was already said. Dropping the leading proposition
       from the whole pool -- not just from the lead slot -- is what makes the
       second turn actually different, instead of repeating turn one because the
       fallback picked the same sentence again. */
    if (skip && props.length > skip) props = props.slice(skip);
    var wantEvent = family === "identity" || /\b(?:when|born|founded|died|released)\b/i.test(analysis.raw || "");
    for (i = 0; i < props.length; i++) {
      var p = props[i];
      if (p.kind === "definition" && p.predicate) {
        /* "tell me more" must not repeat the sentence the previous turn already
           gave. Skipping the lead proposition is how the plan says "next". */
        if (seenDef++ < skip) continue;
        lead = p;
        break;
      }
    }
    if (!lead) {
      /* No copular sentence survived. Take the highest-topic proposition rather
         than the first one, and mark the plan as weaker so the caller can say
         so instead of overclaiming. */
      var best = null;
      for (i = 0; i < props.length; i++)
        if (!best || props[i].topic > best.topic) best = props[i];
      lead = best;
    }
    for (i = 0; i < props.length && support.length < 2; i++) {
      var q = props[i];
      if (q === lead) continue;
      if (q.topic < 0.18) continue;
      if (!wantEvent && q.kind === "event" && support.length >= 1) continue;
      if (q.predicate && lead && normalizeAnswer(q.predicate) === normalizeAnswer(lead.predicate)) continue;
      support.push(q);
    }
    return { family: family, title: title, lead: lead, support: support,
             grounded: !!lead, count: props.length };
  }

  /* ------------------------------------------------------- synthesis
     Generate FROM the proposition, not by editing the source sentence. The
     overlap guard below then measures the result against the evidence and
     restructures again if a long verbatim run survived. Truth outranks
     novelty: a technical phrase, a name, a date or a number is never distorted
     to win the overlap check. */

  var LEAD_FORMS = [
    function (t, pred, cop) { return t + " " + cop + " " + pred + "."; },
    function (t, pred) { return "In short: " + t + " — " + pred + "."; },
    function (t, pred, cop) { return "Put plainly, " + t + " " + cop + " " + pred + "."; },
    function (t, pred, cop) { return "The short version: " + t + " " + cop + " " + pred + "."; }
  ];

  /* A support form receives a COMPLETE clause with its own subject. Handing it
     a bare predicate produced "In practice, used for this stage in the United
     States" -- a sentence with no subject at all. */
  var SUPPORT_FORMS = [
    function (s) { return "Beyond that, " + s; },
    function (s) { return "Worth adding: " + s; },
    function (s) { return "In practice, " + s; },
    function (s) { return "There is also this: " + s; }
  ];

  function stripLeadingSubject(sentence, title) {
    var s = txtOf(sentence);
    try {
      var re = new RegExp("^(?:the\\s+)?" + escRe(title).replace(/\\ /g, "\\s+") + "\\s+", "i");
      var out = s.replace(re, "");
      if (out !== s && out.length > 12) return out.charAt(0).toLowerCase() + out.slice(1);
    } catch (e) {}
    return s.replace(/^It\s+/i, "").replace(/^They\s+/i, "");
  }

  /* Frames ("In short:", "Beyond that,") are voice, not content. Restructuring
     must happen on the CLAUSE, before a frame is attached -- running it after
     produced "In the years between primary education and higher education, in
     short: High school - an institution that educates adolescents." */
  var FRAME_HEAD = /^(?:in short|put plainly|the short version|beyond that|worth adding|in practice|there is also this)\b[:,]?\s*/i;

  function overlapOf(text, evidence) {
    var worst = 0;
    for (var i = 0; i < evidence.length; i++)
      worst = Math.max(worst, longestSharedTokenRun(text, evidence[i]));
    return worst;
  }

  /* Render one complete sentence from a clause, restructuring only as far as
     the overlap guard demands. Every variant reorders the source's own words;
     none of them replaces a term, so a number, a name or a technical phrase
     cannot be altered on the way through. */
  function renderClause(clause, evidence, limit) {
    var c = txtOf(clause).replace(/[.;]+$/, "");
    if (!c) return "";
    var plain = c.charAt(0).toUpperCase() + c.slice(1) + ".";
    if (overlapOf(plain, evidence) <= limit && !isVerbatimSentence(plain, evidence)) return plain;
    var coord = splitCoordinatedClause(c);
    if (coord) {
      var cc = coord.first.charAt(0).toUpperCase() + coord.first.slice(1) + ". " +
               coord.second.charAt(0).toUpperCase() + coord.second.slice(1) + ".";
      if (!isVerbatimSentence(cc, evidence)) return cc;
    }
    var mod = splitModifier(c);
    if (mod && wikiWordTokens(mod.head).length >= 3) {
      var cand = mod.head.charAt(0).toUpperCase() + mod.head.slice(1) + ". It is " +
                 mod.modifier.charAt(0).toLowerCase() + mod.modifier.slice(1).replace(/[.;]+$/, "") + ".";
      if (!isVerbatimSentence(cand, evidence)) return cand;
    }
    var fronted = frontPrepositional(c);
    if (fronted && overlapOf(fronted, evidence) < overlapOf(plain, evidence)) return fronted;
    var deep = deepRewrite(plain);
    if (overlapOf(deep, evidence) < overlapOf(plain, evidence)) return deep;
    return plain;
  }

  function synthesizeFromPlan(plan, analysis, evidence, limit) {
    if (!plan || !plan.lead) return "";
    evidence = evidence || [];
    limit = limit || 13;
    var title = cleanPhrase(plan.title || analysis.lookup || analysis.subject || "");
    if (!title) title = txtOf(plan.title || "");
    var lead = plan.lead, out = [], i;
    var cop = lead.copula || (/s$/i.test(title) && !/ss$/i.test(title) ? "are" : "is");
    var pred = txtOf(lead.predicate || "");

    /* A stable hash of the title picks the opening, so one concept always reads
       the same way and a benchmark is reproducible, while different concepts do
       not all open with the same construction. */
    var h = 0;
    for (i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) & 0x7fffffff;

    if (!pred) {
      /* No copular proposition survived. Restate the source clause under the
         resolved title; invent nothing the evidence did not say. */
      var body0 = rewriteWikiClause(stripLeadingSubject(lead.src || "", title));
      if (!body0) return "";
      /* The title is already the subject of this line, so the clause continues
         it: "Apple Inc — Is an American technology company" reads as two
         sentences fused, which is what capitalising a bare copula produces. */
      var rendered0 = renderClause(body0, evidence, limit);
      if (/^(?:is|are|was|were|can|refers|describes|means)\b/i.test(rendered0))
        rendered0 = rendered0.charAt(0).toLowerCase() + rendered0.slice(1);
      out.push(title + " — " + rendered0);
    } else {
      var full = lead.determiner ? (lead.determiner + " " + pred) : pred;
      full = rewriteWikiClause(full).replace(/[.;]+$/, "");
      var plainLead = LEAD_FORMS[h % LEAD_FORMS.length](title, full, cop);
      /* Before restructuring, try the other openings. The em-dash form drops
         the copula, and that alone is enough to stop the sentence being a
         reproduction of the source -- a cheaper and safer change than moving
         words around. */
      if (isVerbatimSentence(plainLead, evidence)) {
        for (i = 1; i < LEAD_FORMS.length; i++) {
          var alt = LEAD_FORMS[(h + i) % LEAD_FORMS.length](title, full, cop);
          if (!isVerbatimSentence(alt, evidence)) { plainLead = alt; break; }
        }
      }
      if (overlapOf(plainLead, evidence) <= limit && !isVerbatimSentence(plainLead, evidence)) {
        out.push(plainLead);
      } else if (!isVerbatimSentence(plainLead, evidence) &&
                 !splitModifier(full) &&
                 !/\s+(?:by which|in which|through which|where|in that)\s+/i.test(full)) {
        /* Nothing safe left to restructure. A long run inside a technical noun
           phrase is acceptable; reproducing a whole sentence is not, and this
           branch is only reached when the sentence is already not one. */
        out.push(plainLead);
      } else {
        /* A definition whose predicate is one long relative clause is a whole
           source sentence wearing a new opening. Split it at its own seam: the
           head noun becomes the definition, the relative clause becomes a
           second sentence with its prepositional phrase fronted. */
        var seam = full.match(/^(.{3,60}?)\s+(?:by which|in which|through which|where|in that)\s+(.{15,})$/i);
        var built = null;
        if (seam) {
          var head = seam[1].replace(/^the\s+/i, "a ").replace(/[.;,]+$/, "");
          var first = title + " " + cop + " " + head + ".";
          var second = renderClause(seam[2], evidence, limit);
          if (second && overlapOf(first + " " + second, evidence) < overlapOf(plainLead, evidence))
            built = [first, second];
        }
        if (!built) {
          /* Split off a participial or adjectival modifier into its own
             sentence. This is the transform that stops an answer being one
             source sentence with a new opening word. */
          var mod = splitModifier(full);
          if (mod) {
            var s1 = title + " " + cop + " " + mod.head + ".";
            var pron = /s$/i.test(title) && !/ss$/i.test(title) ? "They are" : "It is";
            var s2 = pron + " " + mod.modifier.charAt(0).toLowerCase() +
                     mod.modifier.slice(1).replace(/[.;]+$/, "") + ".";
            if (!isVerbatimSentence(s1, evidence) && !isVerbatimSentence(s2, evidence))
              built = [s1, s2];
          }
        }
        if (!built) {
          /* Front the predicate's own trailing prepositional phrase around the
             copula: "Mercury is a chemical element with symbol Hg" becomes
             "With symbol Hg, mercury is a chemical element." Grammatical,
             word-for-word faithful, and the run has to span the seam. */
          var m = full.match(new RegExp("^(.{10,}?)\\s+(" + PP_HEADS + ")\\s+([^,]{10,})$", "i"));
          if (m && wikiWordTokens(m[3]).length >= 3 && wikiWordTokens(m[1]).length >= 3 &&
              !DANGLING_HEAD.test(m[1]) && !OPEN_RELATIVE.test(m[1]) &&
              !/\b(?:and|or|but)\s+(?:\w+ed|is|are|was|were|has|have|had|became|remains)\b/i.test(m[3])) {
            var tail = m[2].toLowerCase() + " " + m[3].replace(/[.;]+$/, "");
            var cand = tail.charAt(0).toUpperCase() + tail.slice(1) + ", " +
                       title.charAt(0).toLowerCase() + title.slice(1) + " " + cop + " " + m[1] + ".";
            if (overlapOf(cand, evidence) < overlapOf(plainLead, evidence)) built = [cand];
          }
        }
        out = out.concat(built || [plainLead]);
      }
    }

    var leadCount = out.length;
    if (lead.alias && identityKey(lead.alias) !== identityKey(title)) {
      out.push("It also goes by " + txtOf(lead.alias) + ".");
      leadCount = out.length;
    }

    for (i = 0; i < plan.support.length && out.length < 4; i++) {
      var sp = plan.support[i];
      /* The full clause, subject included. Handing a support form a bare
         predicate produced sentences with no subject at all. */
      var body = rewriteWikiClause(sp.src || "").replace(/[.;]+$/, "");
      if (!body || body.length < 16) continue;
      var rendered = renderClause(body, evidence, limit);
      if (!rendered) continue;
      if (FRAME_HEAD.test(rendered)) { out.push(rendered); continue; }
      /* If restructuring already changed the opening, a discourse frame on top
         of it reads like two beginnings. Only a plain clause gets a frame. */
      var plainForm = body.charAt(0).toUpperCase() + body.slice(1) + ".";
      if (rendered === plainForm) {

    while (rebuilt.length > 1 && maxOverlap(joined2, evidence) > limit) {

        disambiguation: !!r.wikiDisambiguation,
        fullText: !!r.wikiRead,

  /* ------------------------------------------------ general conversation
   * A normal chat should not be sent to encyclopedias. This corpus layer is
   * retrieval-only and deliberately isolated from factual research. It loads

   * GitHub's public Contents API (no key), caches them locally, and falls back
   * to raw public files or tiny built-in replies if the network is unavailable. */

    { api: "https://api.github.com/repos/gunthercox/chatterbot-corpus/contents/chatterbot_corpus/data/english/conversations.yml?ref=master",
      raw: "https://raw.githubusercontent.com/gunthercox/chatterbot-corpus/master/chatterbot_corpus/data/english/conversations.yml" },
    { api: "https://api.github.com/repos/gunthercox/chatterbot-corpus/contents/chatterbot_corpus/data/english/greetings.yml?ref=master",
      raw: "https://raw.githubusercontent.com/gunthercox/chatterbot-corpus/master/chatterbot_corpus/data/english/greetings.yml" }

  function ConversationCorpus() {
