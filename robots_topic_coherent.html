<style>
/* Tokens lifted from cell4.art's own stylesheet so this reads as part of the
   site rather than as a widget bolted onto it. */
:root{
  --bg:#f0f0f3;
  --oat:rgba(255,255,255,.58);
  --oat-solid:rgba(255,255,255,.72);
  --accent:#0a0a0a;
  --muted:#71717a;
  --line:rgba(0,0,0,.09);
  --line-soft:rgba(0,0,0,.06);
  --r-sm:10px;
  --r-md:14px;
  --shadow:0 10px 32px -14px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.75);
  --glass:blur(24px) saturate(165%);
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Figtree',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --me:rgba(10,10,10,.92);
  --me-ink:#fafafa;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050506;
    --oat:rgba(255,255,255,.06);
    --oat-solid:rgba(20,20,22,.82);
    --accent:#fafafa;
    --muted:#a1a1aa;
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);
    --shadow:0 12px 34px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
    --shadow-lg:0 24px 60px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
    --me:rgba(250,250,250,.92);
    --me-ink:#0a0a0a;
  }
}
:root[data-theme="dark"]{
  --bg:#050506;--oat:rgba(255,255,255,.06);--oat-solid:rgba(20,20,22,.82);
  --accent:#fafafa;--muted:#a1a1aa;--line:rgba(255,255,255,.10);
  --line-soft:rgba(255,255,255,.06);
  --shadow:0 12px 34px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  --me:rgba(250,250,250,.92);--me-ink:#0a0a0a;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--sans);color:var(--accent);
     -webkit-font-smoothing:antialiased}
/* Embedded in an iframe the page IS the panel, so the ground goes transparent
   and the parent's background shows through the glass. */
body.embed{background:transparent}

#launcher{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:999px;
  border:1px solid var(--line);background:var(--oat);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);box-shadow:var(--shadow);cursor:pointer;display:flex;
  align-items:center;justify-content:center;z-index:40;
  transition:transform .35s cubic-bezier(.16,.84,.44,1),box-shadow .35s ease}
#launcher:hover{transform:translateY(-2px) scale(1.04);box-shadow:var(--shadow-lg)}
#launcher svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6}
#launcher .live{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:999px;
  background:#22c55e;box-shadow:0 0 0 2px var(--bg)}
body.embed #launcher{display:none}

#panel{position:fixed;right:18px;bottom:82px;width:392px;max-width:calc(100vw - 24px);
  height:min(600px,calc(100vh - 110px));display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--oat);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(10px) scale(.985);pointer-events:none;z-index:41;
  transition:opacity .28s ease,transform .34s cubic-bezier(.16,.84,.44,1)}
#panel.open{opacity:1;transform:none;pointer-events:auto}
body.embed #panel{position:static;width:100%;height:100%;max-width:none;right:auto;bottom:auto;
  opacity:1;transform:none;pointer-events:auto;border-radius:0;border:0;
  box-shadow:none;background:var(--oat-solid)}

.top{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.badge{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--oat-solid);display:flex;align-items:center;justify-content:center}
.badge svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.7}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.who span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icobtn{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.icobtn:hover{border-color:var(--line);background:var(--oat-solid);color:var(--accent)}
.icobtn.on{background:var(--me);color:var(--me-ink);border-color:transparent}
.ext{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:7px;
  display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ext b{font-weight:500;color:var(--accent)}
body.embed .close{display:none}

#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#log::-webkit-scrollbar{width:7px}
#log::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.msg{max-width:90%;font-size:13px;line-height:1.55;border-radius:var(--r-md);padding:10px 13px;
  white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .32s cubic-bezier(.16,.84,.44,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--oat-solid);border:1px solid var(--line-soft);
  box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border:1px solid transparent}
.meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{font-family:var(--mono);font-size:10px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.src:hover{color:var(--accent);background:var(--oat-solid)}
.vote{margin-left:auto;display:flex;gap:4px}
.vote button{width:24px;height:22px;border-radius:7px;border:1px solid var(--line);
  background:none;cursor:pointer;font-size:11px;color:var(--muted);line-height:1}
.vote button:hover{color:var(--accent);background:var(--oat-solid)}
.vote button.on{background:var(--me);color:var(--me-ink);border-color:transparent}
.also{margin-top:7px;font-size:12px;color:var(--muted)}
.think{display:flex;gap:4px;align-items:center;padding:12px 13px}
.think i{width:5px;height:5px;border-radius:99px;background:var(--muted);display:block;
  animation:blip 1.1s infinite}
.think i:nth-child(2){animation-delay:.14s}.think i:nth-child(3){animation-delay:.28s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
#chips button{font-size:11.5px;font-family:var(--sans);color:var(--muted);background:var(--oat-solid);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
#chips button:hover{color:var(--accent);box-shadow:var(--shadow)}

.ask{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line-soft)}
.ask input{flex:1;min-width:0;background:var(--oat-solid);border:1px solid var(--line);
  border-radius:999px;padding:10px 14px;font-family:var(--sans);font-size:13px;
  color:var(--accent);outline:none}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:var(--accent)}
.ask button{border:0;border-radius:999px;padding:0 16px;background:var(--me);color:var(--me-ink);
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.ask button:active{transform:scale(.97)}

#status{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:0 14px 9px;

#status .sep{opacity:.4}
#status a{color:var(--muted);text-decoration:underline;cursor:pointer}
#status a:hover{color:var(--accent)}

  /* Inflection, not a new lexeme. Sharing a four-character prefix used to treat
     capital/capitalism and author/authority as the same evidence, which is how
     a page about a different head could still "cover" the question. The shorter
     word must be a complete prefix (work/worked) or a one-letter stem drop
     (price/pricing). A long extra suffix is a different word. */
  function related(a, b) {
    if (a === b) return true;
    if (!a || !b) return false;
    a = String(a).toLowerCase(); b = String(b).toLowerCase();
    var x = a.length <= b.length ? a : b, y = a.length <= b.length ? b : a;
    if (x.length < 4) return false;

    /* Only license recognizable English inflections. Arbitrary prefix growth is
       not morphology: math->MathML, art->article, author->authority and similar
       compounds must never become semantic matches merely because characters
       line up. */
    function inflection(base, word) {
      var plain = ["s", "es", "ed", "er", "ers", "ly", "ing"];
      for (var i = 0; i < plain.length; i++) if (word === base + plain[i]) return true;
      if (/e$/.test(base)) {
        var stem = base.slice(0, -1);

      }
      if (/y$/.test(base)) {

        if (word === ys + "ies" || word === ys + "ied" ||
            word === ys + "ier" || word === ys + "iest") return true;
      }
      var last = base.charAt(base.length - 1);
      if (last && word === base + last + "ing") return true;
      if (last && word === base + last + "ed") return true;
      return false;

  /* ---------------------------------------------------------------- model */
  function Brain(d) {

    this.docs = (this.d.tokens || []).map(function (s) { return s.split(" "); });
    this.idf = Object.assign({}, this.d.idf || {});

  /* One document model per passage: the trained bias row, that passage's

  Brain.prototype.docDist = function (i) {
    if (this._cache[i]) return this._cache[i];
    if (!this.lm) return null;

    var acc = Object.create(null), k, f, row, t;
    for (k = 0; k < v.length; k++) acc[v[k]] = 0;

      row = this.deltas[f];
      if (row) for (t in row) if (t in acc) acc[t] += row[t];

  Brain.prototype.vocabForm = function (w) {

  /* Query likelihood: how probable are the question's words under this

  Brain.prototype.ql = function (i, q) {
    var d = this.docDist(i);
    if (!d) return 0;
    var seen = 0, total = 0, w;
    for (var k = 0; k < q.length; k++) {

      if (w && w in d) { total += Math.log(Math.max(d[w], 1e-9)); seen++; }
    }

    if (!doc.length) return 0;

  /* How much of the question is actually represented by this passage? A bare
     one-word collision is not enough evidence for a multi-part query. */
  Brain.prototype.coverage = function (i, q) {
    var doc = this.docs[i] || [], seen = Object.create(null), need = 0, hit = 0;
    for (var j = 0; j < q.length; j++) {

      if (head.length && head.length <= 12) {
        for (j = 0; j < q.length; j++) if (head.indexOf(q[j]) >= 0) boost += 0.8;
        boost = Math.min(boost, 1.6);
        /* "What does CELL4 do?" is one word once the stop list has had it, and
           term frequency then hands the question to whichever passage repeats
           that word most -- usually the page chrome. A heading that covers the
           whole question is the stronger signal, and a section named for what
           was asked should win. */
        if (asked.length && asked.every(function (w) {
              return head.some(function (h) { return related(w, h); });
            })) boost += 1.4;

      /* Public APIs often return several senses of an ambiguous word. Reward
         the result that covers the source's focused research query, so a row
         matching both the entity and relation outranks a lexical coincidence. */
      if (p.x && p.f) {

    return out.filter(function (s) {

  /* --------------------------------------------------------------- answers */
  function sentences(t) {

  var LOCAL_DANGLING_TAIL = /\b(?:and|or|but|nor|so|yet|of|the|a|an|to|for|in|on|at|by|with|from|as|that|which|who|whose|when|where|because|since|while|if|than|then|into|onto|over|under|between|among|is|are|was|were|be|been|being|has|have|had|do|does|did)\s*$/i;

      var t = tok(s), hit = 0;
      for (var j = 0; j < q.length; j++) {

  var SMALL = [
    [/^(hi|hey|hello|yo|sup|hola|gm)\b/i,
     "Hey. Ask me anything about CELL4 — what the agency does, the work, robots.js, the community, or how to get in touch."],
    [/\b(thanks|thank you|ty|appreciate)\b/i, "Anytime."],
    [/\b(bye|goodbye|cya|see ya)\b/i, "See you."],
    [/\b(who|what) (are|r) (you|u)\b/i,
     "robots.html — a small assistant that reads this site and answers out of it. I run entirely in your browser and I learn from the questions people ask me."],
    [/\b(are you (chat)?gpt|are you claude|are you ai|which model|what model|openai)\b/i,
     "No hosted model and no API. I am a sparse log-linear language model trained on this site's own text — the same model class the CELL4 ARC engine reasons with — running locally in this page."],
    [/\b(help|what can you (do|answer))\b/i,
     "Try: what does CELL4 do · what is robots.js · who is on the team · how do I join the community · how do I get in touch."]
  ];

      if (SMALL[i][0].test(question.trim())) return { text: SMALL[i][1], sources: [] };
    }
    var q = tok(question), hits = brain.rank(question);
    if (!hits.length) {
      return { text: "I could not find that on this site. I only answer from what is actually published here — try what CELL4 does, the proof of work, robots.js, the community, or contact.",
               sources: [] };
    }
    var top = hits[0], body = best(top.p.t, q, 3);

        return { text: clamp(more, 460), sources: [hits[1].p.s, top.p.s], hit: hits[1] };
      }

      if (sameContext && alt && alt.length > 14 && out.text.indexOf(alt.slice(0, 22)) < 0) {

  }

  /* ------------------------------------------------------- self-improvement
   * Every answered question is a labelled example: these words went with that
   * passage. The page takes a gradient step on the passage's own rows of the
   * language model, and keeps it only if a held-out set of earlier questions
   * is still ranked at least as well. That is the same rule the ARC engine
   * lives by -- a change has to earn its place against the version it
   * replaces -- with mean reciprocal rank standing in for the sign test.
   *
   * The weights learned here stay in this browser. `robots.export()` writes
   * them out so they can be folded back into the trained model.
   */
  function Learner(brain) {
    this.b = brain;
    this.hist = [];        /* [{q, passage}] recent, for the gate */
    this.events = [];      /* adopted / rejected, for the status line */
    this.load();
  }

  Learner.prototype.load = function () {
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      this.b.deltas = s.deltas || {};
      this.hist = s.hist || [];
      this.events = s.events || [];
      this.b._cache = {};
    } catch (e) { /* private mode, cleared storage: start fresh */ }
  };

  Learner.prototype.save = function () {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        deltas: this.b.deltas, hist: this.hist.slice(-40), events: this.events.slice(-30)
      }));
    } catch (e) {}
  };

  /* Mean reciprocal rank of the remembered (question -> passage) pairs. */
  Learner.prototype.mrr = function () {
    if (!this.hist.length) return 1;
    var total = 0;
    for (var i = 0; i < this.hist.length; i++) {
      var h = this.hist[i], r = this.b.rank(h.q), place = 0;
      for (var j = 0; j < r.length; j++) {

    return total / this.hist.length;

  Learner.prototype.step = function (question, hit, sign) {
    if (!hit || !this.b.lm) return null;
    var rows = (hit.p.g || []).filter(function (f) { return f.indexOf("s|") === 0; });
    if (!rows.length) return null;              /* nothing document-specific to move */
    var q = tok(question).map(this.b.vocabForm, this.b).filter(Boolean);
    if (!q.length) return null;

    var before = this.mrr();
    var backup = JSON.stringify(this.b.deltas);
    var d = this.b.docDist(hit.i), lr = 0.25 * sign, v = this.b.lm.vocab;
    var target = Object.create(null), i, t, f;
    for (i = 0; i < q.length; i++) target[q[i]] = 1 / q.length;

    for (i = 0; i < v.length; i++) {
      t = v[i];
      var g = (d[t] || 0) - (target[t] || 0);
      if (Math.abs(g) < 1e-4) continue;
      for (var k = 0; k < rows.length; k++) {
        f = rows[k];
        var row = this.b.deltas[f] || (this.b.deltas[f] = {});
        var nv = (row[t] || 0) - lr * g;
        row[t] = Math.max(-1.5, Math.min(1.5, nv));   /* clipped: no runaway */
      }
    }
    this.b._cache = {};

    var key = hit.p.key;
    if (sign > 0 && !this.hist.some(function (h) { return h.q === question; })) {
      this.hist.push({ q: question, key: key });
      if (this.hist.length > 40) this.hist.shift();
    }
    var after = this.mrr();
    var adopted = after >= before - 1e-9;
    if (!adopted) {
      this.b.deltas = JSON.parse(backup);        /* the gate said no */
      this.b._cache = {};
    }
    this.events.push({ t: Date.now(), adopted: adopted,
                       before: +before.toFixed(3), after: +after.toFixed(3) });
    if (this.events.length > 30) this.events.shift();
    this.save();
    return { adopted: adopted, before: before, after: after };
  };

  Learner.prototype.summary = function () {
    var a = 0;
    for (var i = 0; i < this.events.length; i++) if (this.events[i].adopted) a++;
    return { rounds: this.events.length, adopted: a,
             weights: Object.keys(this.b.deltas).length };
  };

  /* ----------------------------------------------------------- live reading
   * Same-origin only -- a browser will not let any page fetch a third party's
   * site, and no amount of JavaScript changes that. What it will let this page
   * read is the rest of cell4.art, which is where the architecture notes and
   * the source files are. */
  function absolute(href, base) {
    try { return new URL(href, base).href; } catch (e) { return null; }
  }

  function chunkText(name, text, url) {
    var out = [], i;
    if (/\.(md|markdown)$/i.test(name)) {
      var parts = text.split(/^(#{1,4}\s+.*)$/m), head = name;
      for (i = 0; i < parts.length; i++) {
        var seg = parts[i].trim();
        if (!seg) continue;
        if (/^#{1,4}\s/.test(seg)) { head = seg.replace(/^#+\s*/, ""); continue; }
        seg.match(/[\s\S]{1,700}(\.|$)/g).forEach(function (block) {
          if (block.trim().length > 40) out.push({ h: head, t: block.trim().replace(/\s+/g, " "), s: url, g: [] });
        });
      }
    } else if (/\.html?$/i.test(name)) {
      var body = text.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ")
                     .replace(/<[^>]+>/g, " ").replace(/&[a-z#0-9]+;/gi, " ");
      body.replace(/\s+/g, " ").match(/[\s\S]{1,700}(\.|$)/g).forEach(function (block) {
        if (block.trim().length > 60) out.push({ h: name, t: block.trim(), s: url, g: [] });
      });
    } else {
      var lines = text.split("\n");
      for (i = 0; i < lines.length; i += 45) {
        var block = lines.slice(i, i + 45).join(" ").replace(/\s+/g, " ").trim();
        if (block.length > 60) {
          out.push({ h: name + " (" + (i + 1) + "-" + (i + 45) + ")",
                     t: block.slice(0, 900), s: url, g: [] });
        }
      }
    }
    return out;
  }

  function readLive(done) {
    if (!/^https?:$/.test(location.protocol)) { return done(null, "local file"); }
    try {
      var cached = JSON.parse(localStorage.getItem(LS_CACHE) || "null");
      if (cached && Date.now() - cached.t < LIVE_TTL && cached.src === SOURCES.join(",")) {
        return done(cached.p, "cached");
      }
    } catch (e) {}

    var pending = SOURCES.length, added = [], files = 0;
    if (!pending) return done(null, "no sources");

    SOURCES.forEach(function (src) {
      var dirUrl = absolute(src, location.href);
      if (!dirUrl || new URL(dirUrl).origin !== location.origin) {
        if (!--pending) finish();
        return;
      }
      fetch(dirUrl, { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function (body) {
          /* A file was given directly; index it. Otherwise treat the response
             as a listing and follow the readable links inside it. */

            added = added.concat(chunkText(dirUrl.split("/").pop(), body, dirUrl));
            files++;
            if (!--pending) finish();
            return;

            var u = absolute(m[1], dirUrl);

              hrefs.push(u);

          hrefs = hrefs.slice(0, 14);
          if (!hrefs.length) { if (!--pending) finish(); return; }
          var left = hrefs.length;
          hrefs.forEach(function (u) {
            fetch(u, { credentials: "same-origin" })
              .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
              .then(function (t) {
                added = added.concat(chunkText(u.split("/").pop(), t.slice(0, 260000), u));
                files++;
              })
              .catch(function () {})
              .then(function () { if (!--left && !--pending) finish(); });
          });
        })

      out = out.replace(new RegExp("(\\b[A-Za-z']+)?(\\s*)\\b" + word + "\\b", "gi"),
